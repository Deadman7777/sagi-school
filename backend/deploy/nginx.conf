# ════════════════════════════════════════════════════════════════════
#  SAGI SCHOOL — nginx (2 vhosts : api + app)
#
#  Installation :
#    sudo cp nginx.conf /etc/nginx/sites-available/sagi-school
#    sudo ln -s /etc/nginx/sites-available/sagi-school /etc/nginx/sites-enabled/
#    sudo nginx -t && sudo systemctl reload nginx
#
#  TLS : certbot --nginx -d api.sagi-school.com -d app.sagi-school.com
# ════════════════════════════════════════════════════════════════════

# ─── API : api.sagi-school.com → gunicorn ──────────────────────────
server {
    listen 80;
    server_name api.sagi-school.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name api.sagi-school.com;

    # certbot remplira ssl_certificate et ssl_certificate_key
    ssl_certificate     /etc/letsencrypt/live/api.sagi-school.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/api.sagi-school.com/privkey.pem;

    client_max_body_size 20M;
    access_log /var/log/nginx/sagi-api-access.log;
    error_log  /var/log/nginx/sagi-api-error.log;

    location /static/ {
        alias /opt/sagi-school/backend/staticfiles/;
        expires 30d;
        add_header Cache-Control "public, immutable";
    }

    location / {
        proxy_pass http://unix:/run/sagi-school/gunicorn.sock;
        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;
        proxy_redirect off;
        proxy_read_timeout 60s;
    }
}

# ─── Front : app.sagi-school.com → fichiers statiques Angular ──────
server {
    listen 80;
    server_name app.sagi-school.com;
    return 301 https://$host$request_uri;
}

server {
    listen 443 ssl http2;
    server_name app.sagi-school.com;

    ssl_certificate     /etc/letsencrypt/live/app.sagi-school.com/fullchain.pem;
    ssl_certificate_key /etc/letsencrypt/live/app.sagi-school.com/privkey.pem;

    root /opt/sagi-school/frontend/dist/frontend/browser;
    index index.html;

    access_log /var/log/nginx/sagi-app-access.log;
    error_log  /var/log/nginx/sagi-app-error.log;

    # Assets hashés : cache long
    location ~* \.(js|css|woff2?|ttf|eot|svg|png|jpg|jpeg|gif|ico)$ {
        expires 1y;
        add_header Cache-Control "public, immutable";
        try_files $uri =404;
    }

    # Angular SPA : tout fallback sur index.html
    location / {
        try_files $uri $uri/ /index.html;
    }
}
