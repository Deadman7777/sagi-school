<!DOCTYPE html>
<html lang="fr">
<head>
<meta charset="UTF-8">
<style>
  /* ── UN BULLETIN PAR DEMI-A4, DEBOUT ─────────────────────────────────
     Gabarit unique : bulletin à l'unité ET bulletins d'une classe.
     Chaque bulletin est rendu sur une demi-feuille A4 (148,5 x 210 mm) ;
     la vue en pose ensuite deux côte à côte sur une A4 couchée, avec un
     trait de découpe vertical au milieu.
     Le 23/09/2026, Shoumoul a imprimé des bulletins de treize matières
     réduits de moitié pour tenir dans leur demi-feuille : illisibles. Le
     gabarit est donc dessiné POUR la demi-feuille — espaces serrés, pas
     de pied de page, texte en gras — et treize matières y tiennent sans
     réduction (tests_bulletins_classe).

     Hauteur variable : un bulletin trop long pour 210 mm est rendu sur
     une page plus haute, que la vue ramène ensuite à l'échelle de la
     demi-feuille (voir _bulletin_sur_une_page). Une chaîne, pas un nombre :
     la locale française écrirait « 210,0 » et la règle @page serait ignorée. */
  /* Police des matières saisies en arabe (Amiri, OFL) : Arial n'a pas
     ces caractères et les imprime en carrés. */
  @font-face { font-family: "arf"; src: url("{{ font_ar|default:'Amiri-Regular.ttf' }}"); }
  .ar { font-family: "arf"; font-size: 10pt; }

  @page { size: 148.5mm {{ hauteur_page|default:"210" }}mm; margin: 6mm 6mm 4mm; }

  /* Interligne fixé : celui de xhtml2pdf par défaut (1,5) faisait déborder
     les signatures sur une deuxième page dès treize matières. */
  body { font-family: Arial, sans-serif; font-size: 9pt; font-weight: bold; line-height: 1.2;
         color: #111; margin: 0; }

  table { border-collapse: collapse; width: 100%; table-layout: fixed; }
  .mb { margin-bottom: 5pt; }

  /* ── EN-TÊTE ── */
  .tbl-entete td { vertical-align: top; padding: 0; }
  .ent-g { text-align: left; }
  .ent-c { text-align: center; }
  .ent-d { text-align: right; }
  .rep       { font-size: 8.5pt; color: #1a3c5e; }
  .devise    { font-size: 7.5pt; font-style: italic; font-weight: normal; color: #444; }
  .tutelle   { font-size: 9pt; }
  .school-name { font-size: 12.5pt; color: #1a3c5e; }
  .school-sub  { font-size: 7pt; font-weight: normal; color: #444; }
  .titre-bul   { font-size: 12.5pt; color: #1a3c5e; }
  .periode     { font-size: 11pt; color: #7b3a00; }
  .sep-line    { border-bottom: 1.2pt solid #1a3c5e; margin: 3pt 0 5pt; }

  /* ── ÉLÈVE : une seule ligne ── */
  .tbl-info td { border: 0.75pt solid #90a4ae; padding: 3pt 4pt 1.5pt; font-size: 10pt; }
  .lbl { font-size: 8pt; font-weight: normal; color: #444; }

  /* ── TABLEAU NOTES ──
     Toutes les cellules du corps sont centrées par défaut (notes, moy, pts, rg).
     MATIÈRE et APPRÉC. sont remises à gauche via .left. */
  .tbl-notes thead td { background-color: #1a3c5e; color: white; padding: 3pt 1pt 1.5pt;
                        font-size: 8pt; text-align: center; border: 0.5pt solid #3a5a7e; }
  .tbl-notes thead td.left { text-align: left; padding-left: 3pt; }
  .tbl-notes tbody td { padding: 2.5pt 1pt 1pt; border: 0.5pt solid #b8c2cc; font-size: 10pt;
                        vertical-align: middle; text-align: center; }
  .tbl-notes tbody td.left { text-align: left; padding-left: 3pt; }
  .tbl-notes tbody tr.pair td { background-color: #eef1f4; }
  .tbl-notes tfoot td { background-color: #dce8ff; padding: 3.5pt 1pt 2pt;
                        border: 0.5pt solid #b0c4de; border-top: 1.2pt solid #1a3c5e;
                        font-size: 10.5pt; text-align: center; }
  .tbl-notes tfoot td.left { text-align: left; padding-left: 3pt; }

  .moy-val  { color: #1a3c5e; }
  .rang-txt { color: #7b3a00; }
  .col-app  { font-size: 9pt; }

  /* ── APPRÉCIATIONS : couleurs foncées, lisibles à l'impression ── */
  .ap-ex  { color: #1b5e20; }
  .ap-tb  { color: #0d47a1; }
  .ap-bi  { color: #1565c0; }
  .ap-ab  { color: #b34700; }
  .ap-pa  { color: #a52a00; }
  .ap-in  { color: #b71c1c; }

  /* ── RÉSULTATS + MENTION ── */
  .tbl-stats td { border: 0.75pt solid #90a4ae; padding: 4pt 2pt 2pt; text-align: center;
                  vertical-align: middle; background-color: #eef3fb; }
  .stat-val { font-size: 12pt; color: #1a3c5e; }
  .stat-lbl { font-size: 6pt; color: #37474f; }
  .tbl-stats td.mention-pos { background-color: #e3f2fd; border: 1pt solid #1565c0; text-align: left; padding-left: 4pt; }
  .tbl-stats td.mention-neg { background-color: #fff3e0; border: 1pt solid #e65100; text-align: left; padding-left: 4pt; }
  .tbl-stats td.final-pos   { background-color: #e8f5e9; border: 1pt solid #2e7d32; text-align: left; padding-left: 4pt; }
  .tbl-stats td.final-neg   { background-color: #ffebee; border: 1pt solid #c62828; text-align: left; padding-left: 4pt; }
  .mention-title { font-size: 6.5pt; text-transform: uppercase; color: #37474f; }
  .mention-text  { font-size: 10pt; }

  /* ── SIGNATURES : juste la place de signer ── */
  .tbl-sig td { text-align: center; vertical-align: top; padding: 2pt 4pt 32pt; }
  .sig-titre { font-size: 9.5pt; text-decoration: underline; }

  .saut { page-break-after: always; }
</style>
</head>
<body>

{% for corps in bulletins %}
  <div{% if not forloop.last %} class="saut"{% endif %}>{{ corps|safe }}</div>
{% endfor %}

</body>
</html>
