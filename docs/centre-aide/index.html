function basculer(section, ouvrir) {
  const b = $('.rubrique-bouton', section), c = $('.rubrique-corps', section);
  const o = ouvrir === undefined ? b.getAttribute('aria-expanded') !== 'true' : ouvrir;
  b.setAttribute('aria-expanded', o); c.hidden = !o;
}
function memoriserOuvertes(id) {
  ecrire('ouvertes:' + id, $$('.rubrique').filter(s => !$('.rubrique-corps', s).hidden).map(s => s.id));
}

function activerArticle(id) {
  $$('.rubrique-bouton').forEach(b => b.addEventListener('click', () => { basculer(b.closest('.rubrique')); memoriserOuvertes(id); }));
  const tout = o => () => { $$('.rubrique').forEach(s => basculer(s, o)); memoriserOuvertes(id); };
  $('#tout-ouvrir')?.addEventListener('click', tout(true));
  $('#tout-fermer')?.addEventListener('click', tout(false));
  activerCoches();
  activerCaptures();
  $$('.copie').forEach(b => b.addEventListener('click', () => copier(b)));
  // Sommaire de droite : la rubrique visible est surlignée.
  const liens = $$('.toc a');
  if (liens.length && 'IntersectionObserver' in window) {
    const obs = new IntersectionObserver(entrees => {
      entrees.filter(e => e.isIntersecting).forEach(e => liens.forEach(l => l.classList.toggle('actif', l.dataset.toc === e.target.id)));
    }, { rootMargin: '-80px 0px -70% 0px' });
    $$('.rubrique').forEach(s => obs.observe(s));
  }
}

function activerCoches() {
  $$('input[data-coche]').forEach(c => {
    const cle = 'coche:' + c.dataset.coche;
    c.checked = lire(cle, false);
    c.addEventListener('change', () => {
      ecrire(cle, c.checked);
      const rub = c.closest('.rubrique');
      if (c.dataset.coche.startsWith('etape-') && rub) rub.classList.toggle('faite', c.checked);
      majCompteurs(); majProgresAZ();
    });
  });
  majCompteurs();
}
function majCompteurs() {
  $$('ul.checklist').forEach(ul => {
    const cases = $$('input', ul), faites = cases.filter(c => c.checked).length;
    let compteur = ul.previousElementSibling;
    if (!compteur || !compteur.classList.contains('compteur-liste')) {
      compteur = document.createElement('p'); compteur.className = 'compteur-liste'; ul.before(compteur);
    }
    compteur.textContent = `${faites} sur ${cases.length} cochés`;
  });
}
function majProgresAZ() {
  const zone = $('#progres-az');
  if (!zone) return;
  const { faites, total } = progressionAZ();
  zone.innerHTML = `<div class="chiffres"><span>Cochez « Étape faite » au fur et à mesure : la progression reste enregistrée sur cet appareil.</span><b>${faites} / ${total}</b></div>
    <div class="jauge" role="progressbar" aria-valuemin="0" aria-valuemax="${total}" aria-valuenow="${faites}"><i style="width:${total ? Math.round(100 * faites / total) : 0}%"></i></div>`;
}

function copier(bouton) {
  const texte = bouton.dataset.copie;
  const ok = () => { const t = bouton.textContent; bouton.textContent = 'Copié'; setTimeout(() => { bouton.textContent = t; }, 1500); };
  const repli = () => { const s = bouton.previousElementSibling; const r = document.createRange(); r.selectNodeContents(s); const sel = getSelection(); sel.removeAllRanges(); sel.addRange(r); };
  try { navigator.clipboard.writeText(texte).then(ok, repli); } catch { repli(); }
}

// ── Visionneuse des captures ──────────────────────────────────────────
let images = [], indexImage = 0;
function activerCaptures() {
  images = $$('figure.capture img');
  images.forEach((img, i) => {
    img.tabIndex = 0; img.setAttribute('role', 'button');
    img.setAttribute('aria-label', 'Agrandir : ' + (img.alt || 'capture'));
    img.addEventListener('click', () => ouvrirImage(i));
    img.addEventListener('keydown', e => { if (e.key === 'Enter' || e.key === ' ') { e.preventDefault(); ouvrirImage(i); } });
  });
}
function ouvrirImage(i) {
  indexImage = (i + images.length) % images.length;
  const img = images[indexImage], fig = img.closest('figure'), cap = fig.querySelector('figcaption');
  $('#v-img').src = img.src; $('#v-img').alt = img.alt;
  $('#v-legende').innerHTML = cap ? cap.innerHTML : '';
  $('#v-compteur').textContent = `Capture ${indexImage + 1} sur ${images.length}`;
  $('#visionneuse').hidden = false; $('#v-fermer').focus();
}
function fermerImage() { $('#visionneuse').hidden = true; images[indexImage]?.focus(); }
$('#v-fermer').addEventListener('click', fermerImage);
$('#v-prec').addEventListener('click', () => ouvrirImage(indexImage - 1));
$('#v-suiv').addEventListener('click', () => ouvrirImage(indexImage + 1));
$('#visionneuse').addEventListener('click', e => { if (e.target.id === 'visionneuse' || e.target.classList.contains('image')) fermerImage(); });

// ── Recherche ─────────────────────────────────────────────────────────
const INDEX = [];
D.ordre.forEach(id => {
  const a = ARTICLES[id];
  INDEX.push({ lien: id, type: 'article', titre: a.titre, chemin: catDe[id].titre, texte: a.chapeau_texte + ' ' + a.intro_texte });
  a.rubriques.forEach(r => INDEX.push({ lien: r.id, type: 'rubrique', titre: r.titre, chemin: catDe[id].titre + ' › ' + a.court, texte: r.texte }));
});
INDEX.forEach(e => { e.nTitre = norm(e.titre); e.nTexte = norm(e.texte); });

function chercher(q) {
  const termes = norm(q).split(/[\s'’,.;:!?()-]+/).filter(t => t.length > 1);
  if (!termes.length) return [];
  const res = [];
  for (const e of INDEX) {
    let score = 0, tous = true;
    for (const t of termes) {
      const dansTitre = e.nTitre.includes(t), dansTexte = e.nTexte.includes(t);
      if (!dansTitre && !dansTexte) { tous = false; break; }
      score += (dansTitre ? 12 : 0) + (dansTexte ? Math.min(6, e.nTexte.split(t).length - 1) : 0);
    }
    if (!tous) continue;
    if (e.type === 'article') score += 4;
    if (!dansProfil(e.lien.split('--')[0])) score -= 3;
    res.push({ e, score });
  }
  return res.sort((a, b) => b.score - a.score).slice(0, 24).map(r => r.e).map(e => ({ ...e, termes }));
}
function surligner(texte, termes) {
  // Surligne sur le texte d'origine, repéré via sa version sans accents (même longueur).
  const n = norm(texte);
  const zones = [];
  termes.forEach(t => { let i = n.indexOf(t); while (i >= 0) { zones.push([i, i + t.length]); i = n.indexOf(t, i + t.length); } });
  zones.sort((a, b) => a[0] - b[0]);
  let h = '', pos = 0;
  zones.forEach(([d, f]) => { if (d < pos) return; h += echap(texte.slice(pos, d)) + '<mark>' + echap(texte.slice(d, f)) + '</mark>'; pos = f; });
  return h + echap(texte.slice(pos));
}
function extrait(e) {
  const n = norm(e.texte);
  let i = Math.min(...e.termes.map(t => { const k = n.indexOf(t); return k < 0 ? Infinity : k; }));
  if (!isFinite(i)) i = 0;
  const debut = Math.max(0, i - 60);
  let t = e.texte.slice(debut, debut + 190);
  return (debut ? '… ' : '') + surligner(t, e.termes) + (debut + 190 < e.texte.length ? ' …' : '');
}

let resultats = [], choisi = 0;
function afficherResultats() {
  const q = $('#champ-recherche').value.trim();
  const zone = $('#resultats');
  if (!q) {
    zone.innerHTML = `<div class="vide"><p>Tapez un mot : « fratrie », « reçu », « clôture », « multi-mode », « bulletin »…</p>
      <div class="suggestions" style="justify-content:center">${['parametrage-az', 'paiements', 'eleves', 'academique', 'comptabilite'].map(id => `<a href="#${id}">${echap(ARTICLES[id].court)}</a>`).join('')}</div></div>`;
    resultats = []; return;
  }
  resultats = chercher(q); choisi = 0;
  if (!resultats.length) {
    zone.innerHTML = `<div class="vide"><p>Aucun résultat pour « ${echap(q)} ».</p><p>Essayez un mot plus court ou le nom de l'écran (Paiements, Élèves, Paramètres…).</p></div>`;
    return;
  }
  const groupes = [['article', 'Articles'], ['rubrique', 'Rubriques']];
  let h = '', k = 0;
  groupes.forEach(([type, libelle]) => {
    const liste = resultats.filter(r => r.type === type);
    if (!liste.length) return;
    h += `<div class="groupe-res">${libelle}</div>`;
    liste.forEach(r => {
      r.rang = k;
      h += `<a class="resultat ${k === 0 ? 'selection' : ''}" href="#${r.lien}" data-rang="${k}" id="res-${k}" role="option">
        <span class="chemin">${echap(r.chemin)}</span><span class="titre">${surligner(r.titre, r.termes)}</span><span class="extrait">${extrait(r)}</span></a>`;
      k++;
    });
  });
  resultats.sort((a, b) => a.rang - b.rang);
  zone.innerHTML = h;
  $$('.resultat', zone).forEach(a => a.addEventListener('mousemove', () => selectionner(+a.dataset.rang)));
}
function selectionner(k) {
  if (!resultats.length) return;
  choisi = (k + resultats.length) % resultats.length;
  $$('.resultat').forEach(a => a.classList.toggle('selection', +a.dataset.rang === choisi));
  $('#res-' + choisi)?.scrollIntoView({ block: 'nearest' });
}
function ouvrirRecherche(q = '') {
  $('#palette').hidden = false;
  const c = $('#champ-recherche'); c.value = q; afficherResultats(); c.focus();
}
function fermerRecherche() { $('#palette').hidden = true; }
$('#ouvrir-recherche').addEventListener('click', () => ouvrirRecherche());
$('#champ-recherche').addEventListener('input', afficherResultats);
$('#champ-recherche').addEventListener('keydown', e => {
  if (e.key === 'ArrowDown') { e.preventDefault(); selectionner(choisi + 1); }
  else if (e.key === 'ArrowUp') { e.preventDefault(); selectionner(choisi - 1); }
  else if (e.key === 'Enter' && resultats[choisi]) { e.preventDefault(); location.hash = resultats[choisi].lien; fermerRecherche(); }
});
$('#palette').addEventListener('click', e => { if (e.target.id === 'palette' || e.target.closest('.resultat') || e.target.closest('.vide a')) fermerRecherche(); });

document.addEventListener('keydown', e => {
  if ((e.ctrlKey || e.metaKey) && e.key.toLowerCase() === 'k') { e.preventDefault(); ouvrirRecherche(); return; }
  if (e.key === 'Escape') {
    if (!$('#visionneuse').hidden) fermerImage();
    else if (!$('#palette').hidden) fermerRecherche();
    else if (document.body.classList.contains('menu-ouvert')) basculerMenu(false);
    return;
  }
  if (!$('#visionneuse').hidden) {
    if (e.key === 'ArrowLeft') ouvrirImage(indexImage - 1);
    if (e.key === 'ArrowRight') ouvrirImage(indexImage + 1);
    return;
  }
  const saisie = /input|textarea|select/i.test(document.activeElement?.tagName || '');
  if (e.key === '/' && !saisie && $('#palette').hidden) { e.preventDefault(); ouvrirRecherche(); }
});

// ── Menu mobile ───────────────────────────────────────────────────────
function basculerMenu(o) {
  const ouvrir = o === undefined ? !document.body.classList.contains('menu-ouvert') : o;
  document.body.classList.toggle('menu-ouvert', ouvrir);
  $('#bouton-menu').setAttribute('aria-expanded', ouvrir);
}
$('#bouton-menu').addEventListener('click', () => basculerMenu());
$('#voile-menu').addEventListener('click', () => basculerMenu(false));
$('#lateral').addEventListener('click', e => { if (e.target.closest('a')) basculerMenu(false); });

// ── Routage par ancre (#article ou #article--rubrique) ────────────────
let articleAffiche = null;
function route() {
  const h = decodeURIComponent(location.hash.slice(1));
  const [id] = h.split('--');
  if (ARTICLES[id]) {
    const cible = h.includes('--') ? h : null;
    if (articleAffiche === id && cible) {
      const el = document.getElementById(cible);
      if (el) { basculer(el, true); memoriserOuvertes(id); el.classList.add('ciblee'); el.scrollIntoView({ block: 'start' }); setTimeout(() => el.classList.remove('ciblee'), 2200); }
    } else {
      rendreArticle(id, cible);
    }
    articleAffiche = id;
    rendreLateral(id);
    document.title = ARTICLES[id].court + ' · Centre d\'aide SAGI SCHOOL';
  } else {
    articleAffiche = null;
    rendreAccueil();
    rendreLateral(null);
    document.title = 'Centre d\'aide SAGI SCHOOL';
    window.scrollTo(0, 0);
  }
}
window.addEventListener('hashchange', route);
route();
</script>
