s, Prise en charge Un paiement multi-mode d'essai apparaît dans chacun de ses canaux Paiements, Tableau de bord › Trésorerie La fiche exportée ne montre aucun montant Élèves › fiche › Exporter la fiche Une sauvegarde a réussi Paramètres › Sauvegarde"}]}, "parametres": {"id": "parametres", "titre": "Paramètres — le socle", "court": "Paramètres — le socle", "nouveau": false, "eyebrow": "Module · toutes les licences", "chapeau": "Douze onglets décident du comportement de tout le reste. C'est\n  le module qu'on ouvre le moins souvent, et celui qui génère le plus d'appels au\n  support quand il a été rempli trop vite.", "chapeau_texte": "Douze onglets décident du comportement de tout le reste. C'est le module qu'on ouvre le moins souvent, et celui qui génère le plus d'appels au support quand il a été rempli trop vite.", "licences": [], "intro": "<div class=\"alerte alerte-info\">\n<h4>Un réglage enregistré s'applique tout de suite<\/h4>\n<p>Depuis la version 1.45.4, une modification de Paramètres est visible\n    immédiatement sur tous les écrans et tous les postes. Si un réglage semble\n    « ne pas prendre », il n'a pas été enregistré : chaque carte a son propre\n    bouton <b>Sauvegarder<\/b>.<\/p>\n<\/div>", "intro_texte": "Un réglage enregistré s'applique tout de suite Depuis la version 1.45.4, une modification de Paramètres est visible immédiatement sur tous les écrans et tous les postes. Si un réglage semble « ne pas prendre », il n'a pas été enregistré : chaque carte a son propre bouton Sauvegarder .", "rubriques": [{"id": "parametres--infos-ecole", "titre": "Infos École", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Ce sont les informations qui figurent sur les documents officiels. Le\n    <b>logo<\/b> s'importe ici (PNG ou JPG, moins d'un méga-octet) et apparaît\n    ensuite en tête des reçus, bulletins, certificats et listes. Le <b>RCCM<\/b> et\n    le <b>NINEA<\/b> ont une conséquence : dès qu'ils sont renseignés, le module\n    Fiscal considère l'établissement comme immatriculé et calcule ses\n    obligations.<\/p>\n<p><span class=\"badge-nouveau\">Nouveau<\/span> Les champs <b>IA<\/b> (inspection\n    d'académie) et <b>IEF<\/b> (inspection de l'éducation et de la formation)\n    s'impriment en tête des bulletins de notes, en français comme en arabe. La\n    <b>civilité et le nom du directeur<\/b> signent le certificat de scolarité.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Infos École : nom, ville, téléphone, e-mail, RCCM, adresse, NINEA, numéro d'autorisation d'ouverture, IA et IEF.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-ecole.webp\"/>\n<figcaption><b>Paramètres › Infos École<\/b><span>Le sélecteur Thème, Sombre, Clair en haut à droite est personnel : chaque utilisateur choisit son affichage sans l'imposer aux autres.<\/span><\/figcaption>\n<\/figure>", "texte": "Ce sont les informations qui figurent sur les documents officiels. Le logo s'importe ici (PNG ou JPG, moins d'un méga-octet) et apparaît ensuite en tête des reçus, bulletins, certificats et listes. Le RCCM et le NINEA ont une conséquence : dès qu'ils sont renseignés, le module Fiscal considère l'établissement comme immatriculé et calcule ses obligations. Nouveau Les champs IA (inspection d'académie) et IEF (inspection de l'éducation et de la formation) s'impriment en tête des bulletins de notes, en français comme en arabe. La civilité et le nom du directeur signent le certificat de scolarité. Paramètres › Infos École Le sélecteur Thème, Sombre, Clair en haut à droite est personnel : chaque utilisateur choisit son affichage sans l'imposer aux autres."}, {"id": "parametres--exercice", "titre": "Exercice", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>L'exercice correspond à l'année scolaire. Le <b>nombre de mensualités<\/b>\n    est le chiffre qui structure le plus le logiciel : il multiplie la mensualité\n    pour donner le dû annuel de chaque élève. Une école qui facture neuf mois,\n    d'octobre à juin, saisit 9, pas 12.<\/p>\n<p>Les <b>soldes initiaux<\/b> de caisse, de banque et de mobile money sont le\n    point de départ de la trésorerie. Sans eux, le logiciel part de zéro et tous\n    les soldes affichés seront décalés de l'argent réellement en caisse le\n    premier jour.<\/p>\n<p>Le nom de l'année est libre : « 2025-2026 » aussi bien que « 2026 ». Le\n    logiciel reprend toujours celui-ci, sans jamais le recalculer d'après le\n    calendrier.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Exercice : année scolaire 2025-2026, dates de début et de fin, 9 mensualités, soldes initiaux de caisse, de banque et de mobile money, trésorerie initiale totale.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-exercice.webp\"/>\n<figcaption><b>Paramètres › Exercice<\/b><span>Les Palmiers facturent 9 mensualités, d'octobre à juin, et démarrent avec 1 550 000 FCFA de trésorerie.<\/span><\/figcaption>\n<\/figure>", "texte": "L'exercice correspond à l'année scolaire. Le nombre de mensualités est le chiffre qui structure le plus le logiciel : il multiplie la mensualité pour donner le dû annuel de chaque élève. Une école qui facture neuf mois, d'octobre à juin, saisit 9, pas 12. Les soldes initiaux de caisse, de banque et de mobile money sont le point de départ de la trésorerie. Sans eux, le logiciel part de zéro et tous les soldes affichés seront décalés de l'argent réellement en caisse le premier jour. Le nom de l'année est libre : « 2025-2026 » aussi bien que « 2026 ». Le logiciel reprend toujours celui-ci, sans jamais le recalculer d'après le calendrier. Paramètres › Exercice Les Palmiers facturent 9 mensualités, d'octobre à juin, et démarrent avec 1 550 000 FCFA de trésorerie."}, {"id": "parametres--echeances-rappels-et-garde-du-soir", "titre": "Échéances, rappels et garde du soir", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>La première carte répond à une seule question : <b>à partir de quand une\n    mensualité est-elle en retard ?<\/b> Les écoles n'y répondent pas toutes de la\n    même façon, et le logiciel s'adapte à chacune.<\/p>\n<\/div><ul class=\"puces\">\n<li><b>Avant le mois<\/b> : la famille règle juillet avant le début de juillet.\n    C'est le fonctionnement des écoles qui encaissent d'avance.<\/li>\n<li><b>Dès le début du mois<\/b> : la mensualité est exigible au jour choisi du\n    mois en cours. C'est le réglage par défaut.<\/li>\n<li><b>À la fin du mois<\/b> : le mois se paie une fois écoulé.<\/li>\n<\/ul><div class=\"texte\">\n<p>Deux cases s'y ajoutent, courantes au Sénégal : encaisser la\n    <b>première<\/b> mensualité dès l'inscription, et encaisser la <b>dernière<\/b>\n    dès l'inscription pour sécuriser le départ de l'élève. Ces mois-là deviennent\n    exigibles à la date d'entrée, et non à leur tour dans le calendrier.<\/p>\n<p><span class=\"badge-nouveau\">Nouveau<\/span> La carte <b>Garde du soir<\/b> règle\n    la facturation des enfants récupérés en retard : l'heure limite de\n    récupération, l'heure à partir de laquelle on facture (la marge entre les deux\n    est une tolérance) et le tarif par tranche. La première tranche va de l'heure\n    limite jusqu'à l'heure pleine suivante, puis on compte une tranche par heure\n    d'horloge.<\/p>\n<p>Plus bas, la carte <b>Rappels<\/b> fixe le jour du mois où la relance\n    s'ouvre, le dernier délai et le texte du SMS. Les enfants d'une même famille\n    ne reçoivent qu'<b>un seul message<\/b>, adressé au responsable de la famille\n    (voir <a href=\"#familles\">Familles<\/a>).<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Échéances : exigibilité des mensualités, jour du mois de l'échéance, cases première et dernière mensualité à l'inscription, puis la carte Garde du soir avec heure limite, heure de facturation et tarif par tranche.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-echeances.webp\"/>\n<figcaption><b>Paramètres › Échéances<\/b><span>Aux Palmiers, un enfant récupéré après 17 h 45 déclenche la facturation ; chaque tranche coûte 1 000 F.<\/span><\/figcaption>\n<\/figure><div class=\"alerte alerte-piege\">\n<h4>Aucun SMS ne part tant qu'on ne l'a pas demandé deux fois<\/h4>\n<p>Par sécurité, l'envoi est en <b>mode simulation<\/b> par défaut : les rappels\n    sont préparés et journalisés, mais aucun message ne sort. Il faut à la fois\n    renseigner la passerelle SMS du fournisseur <i>et<\/i> cocher « Envoyer\n    réellement les SMS ». Faites relire le texte du rappel avant de l'activer : il\n    partira d'un coup à des centaines de familles.<\/p>\n<\/div>", "texte": "La première carte répond à une seule question : à partir de quand une mensualité est-elle en retard ? Les écoles n'y répondent pas toutes de la même façon, et le logiciel s'adapte à chacune. Avant le mois : la famille règle juillet avant le début de juillet. C'est le fonctionnement des écoles qui encaissent d'avance. Dès le début du mois : la mensualité est exigible au jour choisi du mois en cours. C'est le réglage par défaut. À la fin du mois : le mois se paie une fois écoulé. Deux cases s'y ajoutent, courantes au Sénégal : encaisser la première mensualité dès l'inscription, et encaisser la dernière dès l'inscription pour sécuriser le départ de l'élève. Ces mois-là deviennent exigibles à la date d'entrée, et non à leur tour dans le calendrier. Nouveau La carte Garde du soir règle la facturation des enfants récupérés en retard : l'heure limite de récupération, l'heure à partir de laquelle on facture (la marge entre les deux est une tolérance) et le tarif par tranche. La première tranche va de l'heure limite jusqu'à l'heure pleine suivante, puis on compte une tranche par heure d'horloge. Plus bas, la carte Rappels fixe le jour du mois où la relance s'ouvre, le dernier délai et le texte du SMS. Les enfants d'une même famille ne reçoivent qu' un seul message , adressé au responsable de la famille (voir Familles ). Paramètres › Échéances Aux Palmiers, un enfant récupéré après 17 h 45 déclenche la facturation ; chaque tranche coûte 1 000 F. Aucun SMS ne part tant qu'on ne l'a pas demandé deux fois Par sécurité, l'envoi est en mode simulation par défaut : les rappels sont préparés et journalisés, mais aucun message ne sort. Il faut à la fois renseigner la passerelle SMS du fournisseur et cocher « Envoyer réellement les SMS ». Faites relire le texte du rappel avant de l'activer : il partira d'un coup à des centaines de familles."}, {"id": "parametres--frais-sections", "titre": "Frais Sections", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Une section est une <b>grille de tarifs<\/b>, pas une classe. Les Palmiers\n    en ont trois (Maternelle, Élémentaire, Collège) pour huit classes, plus une\n    section Garderie facturée à la journée. Chaque section porte l'inscription,\n    la mensualité, l'uniforme et les fournitures.<\/p>\n<\/div><ul class=\"puces\">\n<li><b>Composer l'inscription<\/b> détaille ce que couvrent les droits\n    d'entrée (dossier, carte scolaire…). Le total ne change pas, mais la famille\n    voit le détail sur son reçu.<\/li>\n<li><b>Facturation : Au mois ou À la journée<\/b>. <span class=\"badge-nouveau\">Nouveau<\/span>\n    En mode « À la journée », on saisit un tarif par demi-journée et par journée,\n    et le dû de l'enfant vient de l'appel quotidien (voir\n    <a href=\"#garderie\">Garderie<\/a>).<\/li>\n<li><b>Formules<\/b>. <span class=\"badge-nouveau\">Nouveau<\/span> Une même section\n    peut proposer plusieurs mensualités selon l'horaire, par exemple une crèche\n    08 h-13 h, 08 h-17 h ou 08 h-19 h. Chaque élève suit une formule, et un\n    changement de formule prend effet à partir d'un mois donné sans réécrire\n    les mois passés.<\/li>\n<li><b>Barème mensuel<\/b>. Il permet de fixer une mensualité différente pour\n    certains mois, par exemple un mois de juin réduit.<\/li>\n<li><b>Ordre<\/b>. Il décide de la place de la section dans les listes PDF.<\/li>\n<li><b>Renouvellement annuel<\/b>, en haut de l'onglet. Quand il est activé,\n    un élève déjà inscrit ne repaie pas l'inscription les années suivantes : il\n    paie un renouvellement, en général moins cher. C'est la pratique courante des\n    daaras. L'ancienneté exigée se compte en mois et se règle école par école.<\/li>\n<\/ul><div class=\"cas\">\n<div class=\"titre-cas\">Les tarifs de l'établissement de démonstration<\/div>\n<div class=\"defile\">\n<table>\n<thead><tr><th>Section<\/th><th class=\"n\">Inscription<\/th><th class=\"n\">Mensualité<\/th><th class=\"n\">Uniforme<\/th><th class=\"n\">Fournitures<\/th><th class=\"n\">Dû annuel (9 mois)<\/th><\/tr><\/thead>\n<tbody>\n<tr><td>Maternelle<\/td><td class=\"n mono\">60 000<\/td><td class=\"n mono\">25 000<\/td><td class=\"n mono\">15 000<\/td><td class=\"n mono\">10 000<\/td><td class=\"n mono\"><b>310 000<\/b><\/td><\/tr>\n<tr><td>Élémentaire<\/td><td class=\"n mono\">75 000<\/td><td class=\"n mono\">30 000<\/td><td class=\"n mono\">18 000<\/td><td class=\"n mono\">12 000<\/td><td class=\"n mono\"><b>375 000<\/b><\/td><\/tr>\n<tr><td>Collège<\/td><td class=\"n mono\">90 000<\/td><td class=\"n mono\">40 000<\/td><td class=\"n mono\">20 000<\/td><td class=\"n mono\">15 000<\/td><td class=\"n mono\"><b>485 000<\/b><\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>\n<p style=\"font-size:14.5px;color:var(--encre-2)\">Le dû annuel ne se saisit\n    jamais. Le logiciel le recalcule à chaque affichage à partir de la section, de\n    la formule, du nombre de mensualités, de la date d'entrée et des services\n    souscrits. Aux Palmiers, l'assurance scolaire (5 000 F) s'y ajoute pour tous\n    les élèves.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Frais Sections : une carte par section avec inscription, choix de facturation au mois ou à la journée, mensualité, liens Composer l'inscription et Formules, boutons Sauvegarder, Barème mensuel et Supprimer.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-sections-cartes.webp\"/>\n<figcaption><b>Paramètres › Frais Sections<\/b><span>Au-dessus des cartes, le bouton <i>Regrouper des sections en formules<\/i> sert aux écoles qui avaient créé une section par horaire : il les fusionne en une section à plusieurs formules. On le lance d'abord en simulation, et les dus sont vérifiés élève par élève.<\/span><\/figcaption>\n<\/figure>", "texte": "Une section est une grille de tarifs , pas une classe. Les Palmiers en ont trois (Maternelle, Élémentaire, Collège) pour huit classes, plus une section Garderie facturée à la journée. Chaque section porte l'inscription, la mensualité, l'uniforme et les fournitures. Composer l'inscription détaille ce que couvrent les droits d'entrée (dossier, carte scolaire…). Le total ne change pas, mais la famille voit le détail sur son reçu. Facturation : Au mois ou À la journée . Nouveau En mode « À la journée », on saisit un tarif par demi-journée et par journée, et le dû de l'enfant vient de l'appel quotidien (voir Garderie ). Formules . Nouveau Une même section peut proposer plusieurs mensualités selon l'horaire, par exemple une crèche 08 h-13 h, 08 h-17 h ou 08 h-19 h. Chaque élève suit une formule, et un changement de formule prend effet à partir d'un mois donné sans réécrire les mois passés. Barème mensuel . Il permet de fixer une mensualité différente pour certains mois, par exemple un mois de juin réduit. Ordre . Il décide de la place de la section dans les listes PDF. Renouvellement annuel , en haut de l'onglet. Quand il est activé, un élève déjà inscrit ne repaie pas l'inscription les années suivantes : il paie un renouvellement, en général moins cher. C'est la pratique courante des daaras. L'ancienneté exigée se compte en mois et se règle école par école. Les tarifs de l'établissement de démonstration Section Inscription Mensualité Uniforme Fournitures Dû annuel (9 mois) Maternelle 60 000 25 000 15 000 10 000 310 000 Élémentaire 75 000 30 000 18 000 12 000 375 000 Collège 90 000 40 000 20 000 15 000 485 000 Le dû annuel ne se saisit jamais. Le logiciel le recalcule à chaque affichage à partir de la section, de la formule, du nombre de mensualités, de la date d'entrée et des services souscrits. Aux Palmiers, l'assurance scolaire (5 000 F) s'y ajoute pour tous les élèves. Paramètres › Frais Sections Au-dessus des cartes, le bouton Regrouper des sections en formules sert aux écoles qui avaient créé une section par horaire : il les fusionne en une section à plusieurs formules. On le lance d'abord en simulation, et les dus sont vérifiés élève par élève."}, {"id": "parametres--services", "titre": "Services", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Un service est facultatif et se souscrit élève par élève. Il a deux\n    périodicités possibles : <b>mensuel<\/b>, ajouté au dû de chaque mois facturé,\n    ou <b>unique<\/b>, dû une seule fois, à l'inscription ou à un mois précis.<\/p>\n<p><span class=\"badge-nouveau\">Nouveau<\/span> Un service peut avoir des <b>frais\n    d'adhésion<\/b> (droit d'entrée au club, kimono…), dus la première fois\n    seulement. Au guichet, le caissier voit si c'est la première adhésion de\n    l'élève. La case <b>1er mois payé à l'inscription<\/b> fait régler le premier\n    mois du service en même temps que l'inscription.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Services : assurance scolaire 5 000 F en paiement unique à l'inscription, cantine 12 000 F par mois, avec le lien Composer des frais d'adhésion et la case 1er mois payé à l'inscription.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-services.webp\"/>\n<figcaption><b>Paramètres › Services<\/b><span>Inscrire un élève à la cantine ajoute 12 000 F à chacun de ses mois facturés, soit 108 000 F sur neuf mois. Ses alertes se recalculent aussitôt.<\/span><\/figcaption>\n<\/figure>", "texte": "Un service est facultatif et se souscrit élève par élève. Il a deux périodicités possibles : mensuel , ajouté au dû de chaque mois facturé, ou unique , dû une seule fois, à l'inscription ou à un mois précis. Nouveau Un service peut avoir des frais d'adhésion (droit d'entrée au club, kimono…), dus la première fois seulement. Au guichet, le caissier voit si c'est la première adhésion de l'élève. La case 1er mois payé à l'inscription fait régler le premier mois du service en même temps que l'inscription. Paramètres › Services Inscrire un élève à la cantine ajoute 12 000 F à chacun de ses mois facturés, soit 108 000 F sur neuf mois. Ses alertes se recalculent aussitôt."}, {"id": "parametres--caisses", "titre": "Caisses", "nouveau": true, "etape": false, "html": "<div class=\"texte\">\n<p>Une école qui encaisse la garderie ou la cantine à part veut savoir ce que\n    contient chaque caisse. On crée ici une caisse par service (Caisse garderie,\n    Caisse cantine…). Chacune a son propre compte de trésorerie, sous-compte du\n    571, créé automatiquement dans le plan comptable, avec son solde et son\n    journal.<\/p>\n<p>Au moment d'encaisser, on choisit la caisse : les <b>espèces<\/b> vont dans\n    celle-ci. Les autres modes (Wave, Orange Money, virement) restent sur leur\n    compte habituel. Une caisse qui a déjà servi ne peut plus être supprimée,\n    seulement désactivée.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Caisses : la caisse garderie avec son compte 5716, son solde courant et la case Actif.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-caisses.webp\"/>\n<figcaption><b>Paramètres › Caisses<\/b><span>La caisse garderie des Palmiers, compte 5716. Ce compte entre dans la trésorerie de l'école comme la caisse principale.<\/span><\/figcaption>\n<\/figure>", "texte": "Une école qui encaisse la garderie ou la cantine à part veut savoir ce que contient chaque caisse. On crée ici une caisse par service (Caisse garderie, Caisse cantine…). Chacune a son propre compte de trésorerie, sous-compte du 571, créé automatiquement dans le plan comptable, avec son solde et son journal. Au moment d'encaisser, on choisit la caisse : les espèces vont dans celle-ci. Les autres modes (Wave, Orange Money, virement) restent sur leur compte habituel. Une caisse qui a déjà servi ne peut plus être supprimée, seulement désactivée. Paramètres › Caisses La caisse garderie des Palmiers, compte 5716. Ce compte entre dans la trésorerie de l'école comme la caisse principale."}, {"id": "parametres--fiche-eleve-et-certificat", "titre": "Fiche élève et certificat", "nouveau": true, "etape": false, "html": "<div class=\"texte\">\n<p>L'onglet <b>Fiche élève<\/b> ajoute les informations propres à l'école\n    sans alourdir le formulaire commun : numéro d'extrait, régime alimentaire,\n    personne autorisée à récupérer l'enfant… Chaque champ a un type (texte, texte\n    long, nombre, date, liste, oui/non), un groupe (identité, parents, santé,\n    autre) et peut être rendu obligatoire. Il apparaît dans le formulaire, sur la\n    fiche et dans la fiche PDF.<\/p>\n<p>L'onglet <b>Certificat<\/b> accepte le <b>modèle Word de l'école<\/b>, tel\n    qu'elle l'imprime déjà. Les pointillés qui suivent « Nom et prénom », « Né(e)\n    le … à … », « Classe », « Année scolaire », « Fait à … le … » sont remplis\n    automatiquement pour chaque élève, et le reste du document n'est pas modifié.\n    Sans modèle, le logiciel produit un certificat standard, sobre, signé par le\n    directeur nommé dans Infos École.<\/p>\n<\/div><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Fiche élève : champs ajoutés par l'école, bouton Ajouter un champ.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-fiche.webp\"/>\n<figcaption><b>Fiche élève<\/b><span>Les champs de l'école, à côté du formulaire commun.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Onglet Certificat : dépôt du modèle Word de l'établissement, et explication du certificat standard.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-certificat.webp\"/>\n<figcaption><b>Certificat<\/b><span>Le modèle Word s'utilise tel quel, sans codes à placer.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "L'onglet Fiche élève ajoute les informations propres à l'école sans alourdir le formulaire commun : numéro d'extrait, régime alimentaire, personne autorisée à récupérer l'enfant… Chaque champ a un type (texte, texte long, nombre, date, liste, oui/non), un groupe (identité, parents, santé, autre) et peut être rendu obligatoire. Il apparaît dans le formulaire, sur la fiche et dans la fiche PDF. L'onglet Certificat accepte le modèle Word de l'école , tel qu'elle l'imprime déjà. Les pointillés qui suivent « Nom et prénom », « Né(e) le … à … », « Classe », « Année scolaire », « Fait à … le … » sont remplis automatiquement pour chaque élève, et le reste du document n'est pas modifié. Sans modèle, le logiciel produit un certificat standard, sobre, signé par le directeur nommé dans Infos École. Fiche élève Les champs de l'école, à côté du formulaire commun. Certificat Le modèle Word s'utilise tel quel, sans codes à placer."}, {"id": "parametres--utilisateurs-et-roles", "titre": "Utilisateurs et rôles", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Un compte par personne, jamais de compte partagé : sinon le journal\n    d'audit ne sert plus à rien.<\/p>\n<\/div><div class=\"defile\">\n<table>\n<thead><tr><th>Rôle<\/th><th>Ce qu'il fait<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>Admin École<\/b><\/td><td>Le directeur ou le fondateur. Accès complet à son établissement, clôture d'exercice comprise.<\/td><\/tr>\n<tr><td><b>Responsable Scolarité<\/b><\/td><td>Élèves, garderie, inscriptions, encaissements, certificats, notes.<\/td><\/tr>\n<tr><td><b>Responsable Comptable<\/b><\/td><td>Comptabilité, charges, investissements, états financiers.<\/td><\/tr>\n<tr><td><b>Responsable RH<\/b><\/td><td>Personnel, bulletins de paie, avances sur salaire.<\/td><\/tr>\n<tr><td><b>Lecteur<\/b><\/td><td>Consultation seule. Utile pour un membre du conseil d'administration ou un expert-comptable externe.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div><div class=\"texte\">\n<p><span class=\"badge-nouveau\">Nouveau<\/span> <b>Modules par utilisateur.<\/b> À la\n    création ou à la modification d'un compte, on peut choisir précisément les\n    modules auxquels la personne a accès, au lieu de ceux de son rôle. Exemple :\n    une surveillante qui ne voit que Élèves et Garderie. La licence reste le\n    plafond : on ne peut pas ouvrir un module que la formule ne contient pas.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Utilisateurs : quatre comptes de l'école avec nom, e-mail, rôle et statut.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-utilisateurs.webp\"/>\n<figcaption><b>Paramètres › Utilisateurs<\/b><span>Le rôle Super Administrateur n'apparaît pas ici. Il est réservé à HADY GESMAN, qui administre l'ensemble des écoles clientes depuis un écran à part.<\/span><\/figcaption>\n<\/figure>", "texte": "Un compte par personne, jamais de compte partagé : sinon le journal d'audit ne sert plus à rien. Rôle Ce qu'il fait Admin École Le directeur ou le fondateur. Accès complet à son établissement, clôture d'exercice comprise. Responsable Scolarité Élèves, garderie, inscriptions, encaissements, certificats, notes. Responsable Comptable Comptabilité, charges, investissements, états financiers. Responsable RH Personnel, bulletins de paie, avances sur salaire. Lecteur Consultation seule. Utile pour un membre du conseil d'administration ou un expert-comptable externe. Nouveau Modules par utilisateur. À la création ou à la modification d'un compte, on peut choisir précisément les modules auxquels la personne a accès, au lieu de ceux de son rôle. Exemple : une surveillante qui ne voit que Élèves et Garderie. La licence reste le plafond : on ne peut pas ouvrir un module que la formule ne contient pas. Paramètres › Utilisateurs Le rôle Super Administrateur n'apparaît pas ici. Il est réservé à HADY GESMAN, qui administre l'ensemble des écoles clientes depuis un écran à part."}, {"id": "parametres--sante-de-la-migration", "titre": "Santé de la migration", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Cet onglet s'adresse aux écoles qui arrivent avec leur historique. Il liste\n    ce qui reste à compléter : élèves sans situation financière, impayés\n    antérieurs saisis, identité d'entrée incomplète, sections sans tarif, élèves\n    sans section. Rien n'y est bloquant : l'école peut travailler et compléter au\n    fil de l'eau. C'est aussi le premier écran à ouvrir quand une école appelle\n    parce que « les chiffres sont bizarres ».<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Santé de la migration : élèves suivis, créances à recouvrer, points à traiter, puis la liste des contrôles avec un voyant par ligne.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-sante.webp\"/>\n<figcaption><b>Paramètres › Santé de la migration<\/b><span>Un voyant par contrôle : vert, c'est réglé ; bleu, c'est une information ; rouge, il faut agir.<\/span><\/figcaption>\n<\/figure>", "texte": "Cet onglet s'adresse aux écoles qui arrivent avec leur historique. Il liste ce qui reste à compléter : élèves sans situation financière, impayés antérieurs saisis, identité d'entrée incomplète, sections sans tarif, élèves sans section. Rien n'y est bloquant : l'école peut travailler et compléter au fil de l'eau. C'est aussi le premier écran à ouvrir quand une école appelle parce que « les chiffres sont bizarres ». Paramètres › Santé de la migration Un voyant par contrôle : vert, c'est réglé ; bleu, c'est une information ; rouge, il faut agir."}]}, "eleves": {"id": "eleves", "titre": "Élèves", "court": "Élèves", "nouveau": false, "eyebrow": "", "chapeau": "C'est le cœur du logiciel. La fiche d'un élève ne contient pas\n  seulement son identité : elle dit ce qu'il doit, ce qu'il a versé, ce qui reste,\n  et le niveau d'alerte qui en résulte. Tous les autres modules s'appuient\n  dessus.", "chapeau_texte": "C'est le cœur du logiciel. La fiche d'un élève ne contient pas seulement son identité : elle dit ce qu'il doit, ce qu'il a versé, ce qui reste, et le niveau d'alerte qui en résulte. Tous les autres modules s'appuient dessus.", "licences": [{"nom": "Essai", "inclus": true}, {"nom": "Basic", "inclus": true}, {"nom": "Pro", "inclus": true}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "<div class=\"texte\">\n<p>Le haut de l'écran est organisé sur deux lignes. La première contient les\n    <b>vues<\/b> : Liste des élèves, Prise en charge, Anciens élèves, Organismes,\n    Familles. La seconde contient les <b>actions<\/b> : Garderie (visible seulement\n    si l'école a une section à la journée ou la garde du soir), Documents,\n    Importer Excel, Impayés antérieurs, Nouvel Élève.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Liste des élèves : vues et actions en haut, compteurs par statut et par genre, filtres, puis le tableau avec matricule, nom, section, genre, statut, total attendu, payé, dû, impayé antérieur, alerte et actions.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-liste.webp\"/>\n<figcaption><b>Élèves<\/b><span>La colonne <i>Alerte<\/i> est celle dont se sert le secrétariat : elle dit qui relancer avant même d'ouvrir une fiche. Les boutons d'action de chaque ligne restent alignés sur une seule ligne.<\/span><\/figcaption>\n<\/figure>", "intro_texte": "Le haut de l'écran est organisé sur deux lignes. La première contient les vues : Liste des élèves, Prise en charge, Anciens élèves, Organismes, Familles. La seconde contient les actions : Garderie (visible seulement si l'école a une section à la journée ou la garde du soir), Documents, Importer Excel, Impayés antérieurs, Nouvel Élève. Élèves La colonne Alerte est celle dont se sert le secrétariat : elle dit qui relancer avant même d'ouvrir une fiche. Les boutons d'action de chaque ligne restent alignés sur une seule ligne.", "rubriques": [{"id": "eleves--les-cinq-niveaux-d-alerte", "titre": "Les cinq niveaux d'alerte", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>L'alerte n'est pas saisie : elle est calculée à chaque affichage, en\n    comparant ce que l'élève <b>devait<\/b> à la date du jour (selon la règle\n    d'échéance de l'école) et ce qu'il a <b>versé<\/b>.<\/p>\n<\/div><div class=\"defile\">\n<table>\n<thead><tr><th>Niveau<\/th><th>Ce qu'il signifie<\/th><th>Ce qu'on en fait<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>À jour<\/b><\/td><td>Rien d'exigible n'est impayé.<\/td><td>Rien.<\/td><\/tr>\n<tr><td><b>OK — Reliquat<\/b><\/td><td>L'élève est à jour sur les mois échus ; il reste les mois à venir.<\/td><td>Rien. Ce n'est pas un retard.<\/td><\/tr>\n<tr><td><b style=\"color:#b7791f\">Attention<\/b> (jaune)<\/td><td>Environ un mois de retard.<\/td><td>Rappel par SMS ou au portail.<\/td><\/tr>\n<tr><td><b style=\"color:#c05621\">Urgent<\/b> (orange)<\/td><td>Environ deux mois de retard.<\/td><td>Convocation du parent.<\/td><\/tr>\n<tr><td><b style=\"color:#c53030\">Critique<\/b> (rouge)<\/td><td>Trois mois de retard ou plus.<\/td><td>Décision de la direction.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div><div class=\"alerte alerte-piege\">\n<h4>« Tous mes élèves sont en critique » : l'appel classique de septembre<\/h4>\n<p>La cause est presque toujours la même : les <b>tarifs de section sont à\n    zéro<\/b>, ou la règle d'échéance est réglée sur « avant le mois » alors que\n    l'école encaisse à terme échu. Vérifiez ces deux points dans Paramètres avant\n    de chercher plus loin. On ne corrige jamais une alerte élève par élève.<\/p>\n<\/div>", "texte": "L'alerte n'est pas saisie : elle est calculée à chaque affichage, en comparant ce que l'élève devait à la date du jour (selon la règle d'échéance de l'école) et ce qu'il a versé . Niveau Ce qu'il signifie Ce qu'on en fait À jour Rien d'exigible n'est impayé. Rien. OK — Reliquat L'élève est à jour sur les mois échus ; il reste les mois à venir. Rien. Ce n'est pas un retard. Attention (jaune) Environ un mois de retard. Rappel par SMS ou au portail. Urgent (orange) Environ deux mois de retard. Convocation du parent. Critique (rouge) Trois mois de retard ou plus. Décision de la direction. « Tous mes élèves sont en critique » : l'appel classique de septembre La cause est presque toujours la même : les tarifs de section sont à zéro , ou la règle d'échéance est réglée sur « avant le mois » alors que l'école encaisse à terme échu. Vérifiez ces deux points dans Paramètres avant de chercher plus loin. On ne corrige jamais une alerte élève par élève."}, {"id": "eleves--inscrire-un-eleve", "titre": "Inscrire un élève", "nouveau": false, "etape": false, "html": "<ol class=\"etapes\">\n<li><b>Élèves › Nouvel Élève.<\/b> Le matricule est attribué par le système au\n    format <span class=\"mono\">année-code école-numéro<\/span>, par exemple\n    <span class=\"mono\">2025-GSLP-0036<\/span> pour le 36ᵉ élève entré en\n    2025-2026. Il ne se saisit pas et suit l'enfant jusqu'à sa sortie.<\/li>\n<li><b>Nom complet, section, genre.<\/b> Le nom s'écrit « Prénom NOM », avec\n    le nom de famille en majuscules : c'est ce qui permet le tri alphabétique par\n    nom de famille, à l'écran comme dans toutes les listes PDF. La section fixe\n    immédiatement le tarif. Une section à formules demande aussi la formule.<\/li>\n<li><b>Date de naissance.<\/b> Si le jour est inconnu, ce qui est fréquent sur\n    les extraits anciens, cochez « jour inconnu » et renseignez seulement le mois\n    et l'année.<\/li>\n<li><b>Date d'entrée.<\/b> Elle est décisive : un élève arrivé en février ne\n    doit pas les mois d'octobre à janvier. Le logiciel calcule le prorata tout\n    seul.<\/li>\n<li><b>Parents et tuteur.<\/b> Au moins un numéro de téléphone valide, sinon\n    les rappels ne partiront pas. <span class=\"badge-nouveau\">Nouveau<\/span> Profession\n    et résidence de chaque parent. Le tuteur peut être une autre personne que les\n    parents : oncle, grand-père, marabout.<\/li>\n<li><b>Santé et comportement.<\/b> Allergies, traitements, maladies\n    chroniques, et <span class=\"badge-nouveau\">Nouveau<\/span> les attitudes\n    particulières à signaler chez l'enfant. Ces informations apparaissent sur la\n    fiche PDF.<\/li>\n<li><b>Champs de l'école<\/b>, s'il y en a (voir Paramètres › Fiche élève).<\/li>\n<li><b>Services souscrits.<\/b> Cantine, transport, assurance : chacun modifie\n    le dû annuel.<\/li>\n<\/ol><figure class=\"capture\">\n<img alt=\"Formulaire Nouvel Élève : nom complet, section, genre, date de naissance, date d'entrée, lieu de naissance, coordonnées, profession et résidence des parents.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-nouveau.webp\"/>\n<figcaption><b>Élèves › Nouvel Élève<\/b><span>Les champs obligatoires portent un astérisque. Le reste peut être complété plus tard sans bloquer l'inscription. L'important est que l'élève existe et que sa section soit juste.<\/span><\/figcaption>\n<\/figure>", "texte": "Élèves › Nouvel Élève. Le matricule est attribué par le système au format année-code école-numéro , par exemple 2025-GSLP-0036 pour le 36ᵉ élève entré en 2025-2026. Il ne se saisit pas et suit l'enfant jusqu'à sa sortie. Nom complet, section, genre. Le nom s'écrit « Prénom NOM », avec le nom de famille en majuscules : c'est ce qui permet le tri alphabétique par nom de famille, à l'écran comme dans toutes les listes PDF. La section fixe immédiatement le tarif. Une section à formules demande aussi la formule. Date de naissance. Si le jour est inconnu, ce qui est fréquent sur les extraits anciens, cochez « jour inconnu » et renseignez seulement le mois et l'année. Date d'entrée. Elle est décisive : un élève arrivé en février ne doit pas les mois d'octobre à janvier. Le logiciel calcule le prorata tout seul. Parents et tuteur. Au moins un numéro de téléphone valide, sinon les rappels ne partiront pas. Nouveau Profession et résidence de chaque parent. Le tuteur peut être une autre personne que les parents : oncle, grand-père, marabout. Santé et comportement. Allergies, traitements, maladies chroniques, et Nouveau les attitudes particulières à signaler chez l'enfant. Ces informations apparaissent sur la fiche PDF. Champs de l'école , s'il y en a (voir Paramètres › Fiche élève). Services souscrits. Cantine, transport, assurance : chacun modifie le dû annuel. Élèves › Nouvel Élève Les champs obligatoires portent un astérisque. Le reste peut être complété plus tard sans bloquer l'inscription. L'important est que l'élève existe et que sa section soit juste."}, {"id": "eleves--la-fiche-eleve", "titre": "La fiche élève", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>L'icône en forme d'œil ouvre la fiche : identité, scolarité, parents,\n    santé, et surtout la <b>situation financière détaillée mois par mois<\/b>. On y\n    voit ce qui était dû, ce qui a été payé et ce qui reste, avec les mois en\n    retard signalés.<\/p>\n<p>En bas de la fiche, cinq boutons : <b>Modifier<\/b>, <b>Parcours\n    scolaire<\/b>, <b>Exporter la fiche<\/b> (la fiche de renseignements en PDF,\n    <span class=\"badge-nouveau\">Nouveau<\/span> sans aucune donnée financière : elle se\n    remet aux enseignants et au surveillant),\n    <b>Certificat de scolarité<\/b> (en Word si l'école a déposé son modèle,\n    sinon en PDF) et <b>Situation financière<\/b>. Ils répondent à 90 % des\n    demandes d'un parent au guichet.<\/p>\n<\/div><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Fiche élève, partie situation financière : mois facturés, total attendu, total payé, reste, détail par mois avec le mois de juin signalé en retard.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-fiche-situation.webp\"/>\n<figcaption><b>Fiche élève<\/b><span>Juin est marqué <i>en retard<\/i> : la famille a réglé huit mois sur neuf.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture document\">\n<img alt=\"Certificat de scolarité standard : logo, « Je soussignée, Madame Aminata Ndiaye, Directrice », identité de l'élève, classe, année scolaire, lieu, date et signature.\" decoding=\"async\" loading=\"lazy\" src=\"captures/doc-certificat.webp\"/>\n<figcaption><b>Certificat standard<\/b><span>Identité « L'élève / Né(e) le / Matricule / Classe », signé du nom du directeur.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "L'icône en forme d'œil ouvre la fiche : identité, scolarité, parents, santé, et surtout la situation financière détaillée mois par mois . On y voit ce qui était dû, ce qui a été payé et ce qui reste, avec les mois en retard signalés. En bas de la fiche, cinq boutons : Modifier , Parcours scolaire , Exporter la fiche (la fiche de renseignements en PDF, Nouveau sans aucune donnée financière : elle se remet aux enseignants et au surveillant), Certificat de scolarité (en Word si l'école a déposé son modèle, sinon en PDF) et Situation financière . Ils répondent à 90 % des demandes d'un parent au guichet. Fiche élève Juin est marqué en retard : la famille a réglé huit mois sur neuf. Certificat standard Identité « L'élève / Né(e) le / Matricule / Classe », signé du nom du directeur."}, {"id": "eleves--prise-en-charge-bourses-et-boursiers", "titre": "Prise en charge, bourses et boursiers", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Il y a trois situations différentes, que le logiciel ne confond jamais :<\/p>\n<\/div><ul class=\"puces\">\n<li><b>La prise en charge par l'école<\/b> : orphelin, handicap, famille\n    démunie. L'école renonce à une partie de ses frais, donc le dû de l'élève\n    diminue réellement.<\/li>\n<li><b>La réduction fratrie<\/b> : c'est aussi une remise, saisie enfant par\n    enfant dans la fenêtre de la famille (voir <a href=\"#familles\">Familles<\/a>).<\/li>\n<li><b>La bourse d'un organisme<\/b> : une entreprise, une fondation ou l'État\n    paie à la place de la famille. Le dû total <b>ne change pas<\/b> : il se\n    partage entre ce que doit l'organisme et ce que doit la famille. L'alerte de\n    retard ne porte que sur la part de la famille, et l'onglet\n    <b>Organismes<\/b> suit ce que chaque organisme doit encore.<\/li>\n<\/ul><figure class=\"capture\">\n<img alt=\"Fenêtre Situation financière d'un élève : motif de prise en charge, montants pris en charge sur l'inscription et la mensualité, bourse d'un organisme, mois facturés, simulation de l'impact financier.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-pec.webp\"/>\n<figcaption><b>Fiche élève › Situation financière<\/b><span>La case « Calculer automatiquement depuis la date d'entrée » déduit les mois facturés du prorata. On ne la décoche que pour imposer un nombre de mois négocié avec la famille. La simulation en bas montre l'effet avant d'enregistrer.<\/span><\/figcaption>\n<\/figure><div class=\"alerte alerte-info\">\n<h4>Pourquoi cette distinction compte pour la direction<\/h4>\n<p>Une bourse traitée comme une remise fait disparaître une créance bien\n    réelle : l'école cesse de réclamer à l'organisme ce qu'il lui doit. En les\n    séparant, le logiciel garde d'un côté la dette de l'organisme (compte 4112),\n    de l'autre celle de la famille, et n'alerte que sur la seconde.<\/p>\n<\/div><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Prise en charge : nombre de bénéficiaires, perte annuelle, impact financier des prises en charge, puis la liste des élèves concernés avec leur motif.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-onglet-pec.webp\"/>\n<figcaption><b>Prise en charge<\/b><span>Ce que coûtent à l'école les remises qu'elle accorde, orphelins et fratries compris.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Onglet Organismes : nombre d'organismes et de boursiers, montant couvert, reçu et restant dû, puis la liste des organismes avec les boutons Encaisser la bourse et Relevé PDF.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-organismes.webp\"/>\n<figcaption><b>Organismes<\/b><span>Ce que chaque organisme doit encore à l'école.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "Il y a trois situations différentes, que le logiciel ne confond jamais : La prise en charge par l'école : orphelin, handicap, famille démunie. L'école renonce à une partie de ses frais, donc le dû de l'élève diminue réellement. La réduction fratrie : c'est aussi une remise, saisie enfant par enfant dans la fenêtre de la famille (voir Familles ). La bourse d'un organisme : une entreprise, une fondation ou l'État paie à la place de la famille. Le dû total ne change pas : il se partage entre ce que doit l'organisme et ce que doit la famille. L'alerte de retard ne porte que sur la part de la famille, et l'onglet Organismes suit ce que chaque organisme doit encore. Fiche élève › Situation financière La case « Calculer automatiquement depuis la date d'entrée » déduit les mois facturés du prorata. On ne la décoche que pour imposer un nombre de mois négocié avec la famille. La simulation en bas montre l'effet avant d'enregistrer. Pourquoi cette distinction compte pour la direction Une bourse traitée comme une remise fait disparaître une créance bien réelle : l'école cesse de réclamer à l'organisme ce qu'il lui doit. En les séparant, le logiciel garde d'un côté la dette de l'organisme (compte 4112), de l'autre celle de la famille, et n'alerte que sur la seconde. Prise en charge Ce que coûtent à l'école les remises qu'elle accorde, orphelins et fratries compris. Organismes Ce que chaque organisme doit encore à l'école."}, {"id": "eleves--encaisser-la-bourse-d-un-organisme", "titre": "Encaisser la bourse d'un organisme", "nouveau": true, "etape": false, "html": "<div class=\"texte\">\n<p>Quand un ministère ou une fondation vire l'argent de ses boursiers, on\n    l'encaisse depuis l'onglet <b>Organismes<\/b> avec l'icône portefeuille. On\n    saisit le montant du virement et on clique sur <b>Répartir<\/b> : le logiciel le\n    partage entre les boursiers, mois par mois, sur la part que l'organisme doit\n    encore. La référence du virement ou du chèque se note avant d'encaisser.<\/p>\n<p>Chaque part devient un règlement au nom de l'élève, marqué « organisme ».\n    En comptabilité, la banque est débitée et la créance sur l'organisme (4112)\n    soldée : la famille n'est jamais débitée de la bourse. En dépliant la ligne de\n    l'organisme, on voit pour chaque boursier ce qui est couvert, reçu, restant\n    dû, et chaque versement avec sa date et son numéro de pièce. L'icône PDF\n    produit le <b>relevé de l'organisme<\/b>, la pièce à joindre à une relance.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Fenêtre Encaisser la bourse : montant versé par l'organisme, bouton Répartir, puis pour chaque boursier les mois servis et le montant imputé sur chacun.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-organisme-encaisser.webp\"/>\n<figcaption><b>Encaisser la bourse<\/b><span>Un virement de 100 000 F réparti entre les deux boursiers, du plus ancien mois au plus récent.<\/span><\/figcaption>\n<\/figure>", "texte": "Quand un ministère ou une fondation vire l'argent de ses boursiers, on l'encaisse depuis l'onglet Organismes avec l'icône portefeuille. On saisit le montant du virement et on clique sur Répartir : le logiciel le partage entre les boursiers, mois par mois, sur la part que l'organisme doit encore. La référence du virement ou du chèque se note avant d'encaisser. Chaque part devient un règlement au nom de l'élève, marqué « organisme ». En comptabilité, la banque est débitée et la créance sur l'organisme (4112) soldée : la famille n'est jamais débitée de la bourse. En dépliant la ligne de l'organisme, on voit pour chaque boursier ce qui est couvert, reçu, restant dû, et chaque versement avec sa date et son numéro de pièce. L'icône PDF produit le relevé de l'organisme , la pièce à joindre à une relance. Encaisser la bourse Un virement de 100 000 F réparti entre les deux boursiers, du plus ancien mois au plus récent."}, {"id": "eleves--sortie-et-reintegration", "titre": "Sortie et réintégration", "nouveau": true, "etape": false, "html": "<div class=\"texte\">\n<p>Un élève qui quitte l'école passe au statut <b>Transféré<\/b> ou\n    <b>Abandonné<\/b>, avec sa <b>date de sortie<\/b>. Il ne doit alors que ce qui\n    était exigible au jour de son départ : les mois suivants disparaissent de son\n    dû, et il ne pèse plus dans les alertes de l'école.<\/p>\n<p>S'il revient, on le retrouve dans <b>Anciens élèves<\/b> et on le\n    <b>réintègre<\/b>. Le logiciel montre d'abord ce que la réintégration change\n    (mois dus, dette reprise), puis garde la trace des deux mouvements. On ne\n    remet jamais une fiche sortie en « Inscrit » à la main, sauf si la sortie a\n    été saisie par erreur le jour même.<\/p>\n<\/div>", "texte": "Un élève qui quitte l'école passe au statut Transféré ou Abandonné , avec sa date de sortie . Il ne doit alors que ce qui était exigible au jour de son départ : les mois suivants disparaissent de son dû, et il ne pèse plus dans les alertes de l'école. S'il revient, on le retrouve dans Anciens élèves et on le réintègre . Le logiciel montre d'abord ce que la réintégration change (mois dus, dette reprise), puis garde la trace des deux mouvements. On ne remet jamais une fiche sortie en « Inscrit » à la main, sauf si la sortie a été saisie par erreur le jour même."}, {"id": "eleves--import-excel-impayes-anterieurs-et-reprise", "titre": "Import Excel, impayés antérieurs et reprise", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Une école qui passe à SAGI SCHOOL en cours d'année n'a pas à ressaisir ses\n    effectifs. <b>Importer Excel<\/b> fournit un modèle ; on le remplit et on le\n    renvoie. Une colonne « Famille » permet de regrouper les frères et sœurs dès\n    l'import.<\/p>\n<p><b>Impayés antérieurs<\/b> sert à saisir, élève par élève, ce qui restait dû\n    sur les années d'avant. Ces montants s'ajoutent à la dette de l'élève sans\n    compter comme une recette de l'année.<\/p>\n<\/div><div class=\"alerte alerte-erreur\">\n<h4>À ne jamais faire<\/h4>\n<p>Saisir les règlements antérieurs à la bascule comme des paiements\n    ordinaires. La trésorerie et le compte de résultat grossiraient de tout\n    l'historique de l'école. Ce qui a été réglé avant la bascule se déclare par\n    la reprise (Situation financière › Corriger la répartition) : la situation de\n    l'élève est ajustée sans créer de recette ni toucher la trésorerie.<\/p>\n<\/div>", "texte": "Une école qui passe à SAGI SCHOOL en cours d'année n'a pas à ressaisir ses effectifs. Importer Excel fournit un modèle ; on le remplit et on le renvoie. Une colonne « Famille » permet de regrouper les frères et sœurs dès l'import. Impayés antérieurs sert à saisir, élève par élève, ce qui restait dû sur les années d'avant. Ces montants s'ajoutent à la dette de l'élève sans compter comme une recette de l'année. À ne jamais faire Saisir les règlements antérieurs à la bascule comme des paiements ordinaires. La trésorerie et le compte de résultat grossiraient de tout l'historique de l'école. Ce qui a été réglé avant la bascule se déclare par la reprise (Situation financière › Corriger la répartition) : la situation de l'élève est ajustée sans créer de recette ni toucher la trésorerie."}, {"id": "eleves--documents", "titre": "Documents", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Le bouton <b>Documents<\/b> déplie deux exports PDF : la liste financière\n    (attendu, payé, reste par élève) et la liste nominative (une liste de classe,\n    sans montants). Le menu <b>Ordre des listes PDF<\/b> choisit le groupement (par\n    classe, par section ou toute l'école) et l'ordre (alphabétique par nom de\n    famille ou par matricule). Le menu <b>Classe<\/b> limite les deux listes à une\n    seule classe, pour que chaque titulaire reçoive la sienne.<\/p>\n<\/div>", "texte": "Le bouton Documents déplie deux exports PDF : la liste financière (attendu, payé, reste par élève) et la liste nominative (une liste de classe, sans montants). Le menu Ordre des listes PDF choisit le groupement (par classe, par section ou toute l'école) et l'ordre (alphabétique par nom de famille ou par matricule). Le menu Classe limite les deux listes à une seule classe, pour que chaque titulaire reçoive la sienne."}]}, "familles": {"id": "familles", "titre": "Familles et fratries", "court": "Familles et fratries", "nouveau": false, "eyebrow": "", "chapeau": "« M. Ndiaye a cinq enfants inscrits. » Regrouper les frères et\n  sœurs évite de saisir cinq fois les mêmes coordonnées, donne le total de ce que\n  doit la famille, et n'envoie qu'un seul rappel au lieu de cinq.", "chapeau_texte": "« M. Ndiaye a cinq enfants inscrits. » Regrouper les frères et sœurs évite de saisir cinq fois les mêmes coordonnées, donne le total de ce que doit la famille, et n'envoie qu'un seul rappel au lieu de cinq.", "licences": [{"nom": "Toutes les licences", "inclus": true}], "intro": "<div class=\"texte\">\n<p>Regrouper ne change <b>aucun montant<\/b> : le dû reste calculé fiche par\n    fiche. La famille est une vue et un point de contact, pas un nouveau\n    débiteur.<\/p>\n<\/div><ol class=\"etapes\">\n<li><b>Regrouper les fratries.<\/b> Le logiciel propose les groupes qu'il\n    déduit des <b>numéros de téléphone<\/b> des parents, jamais du nom seul. Un\n    groupe « sûr » porte un seul nom de famille ; un groupe « à vérifier » en\n    mélange plusieurs (famille recomposée, ou deux foyers qui partagent un\n    numéro). L'école coche ce qu'elle valide et crée tout d'un clic.<\/li>\n<li><b>Désigner le responsable.<\/b> Chaque famille a un ou plusieurs\n    responsables (père, mère, tuteur) ; le principal est celui qu'on appelle.\n    Des parents séparés restent une seule famille, et chaque règlement note qui a\n    payé.<\/li>\n<li><b>Réduction fratrie<\/b> (facultatif). <span class=\"badge-nouveau\">Nouveau<\/span>\n    Plus de barème par rang : dans la fenêtre de la famille, on nomme l'enfant et\n    on saisit sa remise, en pourcentage ou en montant, séparément sur\n    l'inscription et sur la mensualité. Le tarif de l'enfant est rappelé sous\n    chaque case. Une prise en charge d'un autre motif (orphelin, par exemple)\n    n'est jamais écrasée : elle se modifie depuis la fiche de l'élève.<\/li>\n<\/ol><figure class=\"capture\">\n<img alt=\"Onglet Familles : boutons Regrouper les fratries et Nouvelle famille, puis la liste des familles avec code, nom, contact et nombre d'enfants.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-familles.webp\"/>\n<figcaption><b>Élèves › Familles<\/b><span>Cinq familles aux Palmiers. Le chiffre bleu est le nombre d'enfants inscrits.<\/span><\/figcaption>\n<\/figure><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Fenêtre Famille NDIAYE : nombre d'enfants, total dû, total payé, reste à payer et le détail par enfant.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-famille-situation.webp\"/>\n<figcaption><b>Situation de la famille<\/b><span>Enfant par enfant : dû, payé, reste.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Rubrique Réduction fratrie de la famille NDIAYE : une ligne par enfant nommé, remise sur l'inscription et sur la mensualité en FCFA ou en pourcentage, tarif rappelé, bouton Enregistrer les réductions.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-famille-reduction.webp\"/>\n<figcaption><b>Réduction fratrie<\/b><span>Une ligne par enfant, nommé : pas de rang à configurer.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "intro_texte": "Regrouper ne change aucun montant : le dû reste calculé fiche par fiche. La famille est une vue et un point de contact, pas un nouveau débiteur. Regrouper les fratries. Le logiciel propose les groupes qu'il déduit des numéros de téléphone des parents, jamais du nom seul. Un groupe « sûr » porte un seul nom de famille ; un groupe « à vérifier » en mélange plusieurs (famille recomposée, ou deux foyers qui partagent un numéro). L'école coche ce qu'elle valide et crée tout d'un clic. Désigner le responsable. Chaque famille a un ou plusieurs responsables (père, mère, tuteur) ; le principal est celui qu'on appelle. Des parents séparés restent une seule famille, et chaque règlement note qui a payé. Réduction fratrie (facultatif). Nouveau Plus de barème par rang : dans la fenêtre de la famille, on nomme l'enfant et on saisit sa remise, en pourcentage ou en montant, séparément sur l'inscription et sur la mensualité. Le tarif de l'enfant est rappelé sous chaque case. Une prise en charge d'un autre motif (orphelin, par exemple) n'est jamais écrasée : elle se modifie depuis la fiche de l'élève. Élèves › Familles Cinq familles aux Palmiers. Le chiffre bleu est le nombre d'enfants inscrits. Situation de la famille Enfant par enfant : dû, payé, reste. Réduction fratrie Une ligne par enfant, nommé : pas de rang à configurer.", "rubriques": [{"id": "familles--encaisser-pour-toute-la-famille", "titre": "Encaisser pour toute la famille", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Dans la fenêtre de la famille, <b>Encaisser pour la famille<\/b> reprend la\n    logique du guichet pour toute la fratrie. Chaque enfant montre ses échéances :\n    impayé antérieur, frais d'entrée, uniforme, services, puis chaque mois, marqués\n    <b>En retard<\/b> ou <b>À venir<\/b>. On coche ce que le parent règle, y compris\n    des mois à venir : une famille peut payer d'avance. Le montant de chaque ligne\n    se corrige pour un acompte.<\/p>\n<p>Deux raccourcis : <b>Cocher tout l'échu<\/b>, ou saisir le <b>montant versé<\/b>\n    et cliquer sur <b>Répartir<\/b>. Le logiciel sert alors le plus ancien dû d'abord,\n    tous enfants confondus. Avec la case <b>Inclure les mois à venir<\/b>, ce qui\n    dépasse l'échu est imputé d'avance sur les mois suivants. Sans elle, le surplus\n    est signalé et le caissier décide.<\/p>\n<p>On choisit ensuite le mode, la caisse, la date et qui a payé, puis\n    <b>Encaisser<\/b>. Chaque ligne devient un règlement ordinaire, avec les mêmes\n    écritures qu'au guichet : la mensualité en 706, la cantine et les autres\n    services en 758. La famille reçoit <b>un seul reçu<\/b> qui détaille chaque\n    enfant et chaque mois réglé. Pour un enfant boursier, la part attendue de\n    l'organisme n'est jamais réclamée à la famille.<\/p>\n<p><span class=\"badge-nouveau\">Nouveau<\/span> Le bouton <b>Situation financière\n    (PDF)<\/b> produit le document que le parent emporte : chaque enfant, chaque\n    mois, le dû, le payé, le reste et la situation (soldé, en retard, à venir),\n    avec le total à la charge de la famille.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Fenêtre Encaisser pour la famille : montant versé, case Inclure les mois à venir, bouton Répartir, puis pour chaque enfant ses échéances avec une case à cocher, leur situation, le reste dû et le montant à encaisser.\" decoding=\"async\" loading=\"lazy\" src=\"captures/eleves-famille-encaisser.webp\"/>\n<figcaption><b>Encaissement familial<\/b><span>Les mois cochés de chaque enfant, avec le total en bas. Les mois à venir se cochent de la même façon.<\/span><\/figcaption>\n<\/figure>", "texte": "Dans la fenêtre de la famille, Encaisser pour la famille reprend la logique du guichet pour toute la fratrie. Chaque enfant montre ses échéances : impayé antérieur, frais d'entrée, uniforme, services, puis chaque mois, marqués En retard ou À venir . On coche ce que le parent règle, y compris des mois à venir : une famille peut payer d'avance. Le montant de chaque ligne se corrige pour un acompte. Deux raccourcis : Cocher tout l'échu , ou saisir le montant versé et cliquer sur Répartir . Le logiciel sert alors le plus ancien dû d'abord, tous enfants confondus. Avec la case Inclure les mois à venir , ce qui dépasse l'échu est imputé d'avance sur les mois suivants. Sans elle, le surplus est signalé et le caissier décide. On choisit ensuite le mode, la caisse, la date et qui a payé, puis Encaisser . Chaque ligne devient un règlement ordinaire, avec les mêmes écritures qu'au guichet : la mensualité en 706, la cantine et les autres services en 758. La famille reçoit un seul reçu qui détaille chaque enfant et chaque mois réglé. Pour un enfant boursier, la part attendue de l'organisme n'est jamais réclamée à la famille. Nouveau Le bouton Situation financière (PDF) produit le document que le parent emporte : chaque enfant, chaque mois, le dû, le payé, le reste et la situation (soldé, en retard, à venir), avec le total à la charge de la famille. Encaissement familial Les mois cochés de chaque enfant, avec le total en bas. Les mois à venir se cochent de la même façon."}]}, "garderie": {"id": "garderie", "titre": "Garderie et garde du soir", "court": "Garderie et garde du soir", "nouveau": false, "eyebrow": "", "chapeau": "Pour les crèches et les écoles qui gardent des enfants à la\n  journée : le dû naît de la présence, et la famille paie au rythme qui lui\n  convient (au jour, à la semaine ou au mois).", "chapeau_texte": "Pour les crèches et les écoles qui gardent des enfants à la journée : le dû naît de la présence, et la famille paie au rythme qui lui convient (au jour, à la semaine ou au mois).", "licences": [{"nom": "Toutes les licences", "inclus": true}], "intro": "<div class=\"texte\">\n<p>L'écran s'ouvre depuis le bouton <b>Garderie<\/b> du module Élèves. Il\n    concerne les enfants inscrits dans une section facturée <b>à la journée<\/b>\n    (voir Paramètres › Frais Sections).<\/p>\n<\/div>", "intro_texte": "L'écran s'ouvre depuis le bouton Garderie du module Élèves. Il concerne les enfants inscrits dans une section facturée à la journée (voir Paramètres › Frais Sections).", "rubriques": [{"id": "garderie--l-appel-du-jour", "titre": "L'appel du jour", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Chaque matin, on marque chaque enfant : <b>Absent<\/b>, <b>½ journée<\/b> ou\n    <b>journée<\/b>. Le total du jour s'affiche en haut, puis on clique sur\n    <b>Enregistrer l'appel<\/b>. Le tarif est figé au moment de l'appel : changer\n    le prix plus tard ne modifie pas les journées passées.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Garderie, onglet Appel du jour : date, classe, nombre de présents et montant du jour, puis un enfant par ligne avec les choix Absent, demi-journée et journée.\" decoding=\"async\" loading=\"lazy\" src=\"captures/garderie-appel.webp\"/>\n<figcaption><b>Garderie › Appel du jour<\/b><span>Les boutons « Tous en journée » et « Tous absents » évitent soixante clics quand la classe est complète.<\/span><\/figcaption>\n<\/figure>", "texte": "Chaque matin, on marque chaque enfant : Absent , ½ journée ou journée . Le total du jour s'affiche en haut, puis on clique sur Enregistrer l'appel . Le tarif est figé au moment de l'appel : changer le prix plus tard ne modifie pas les journées passées. Garderie › Appel du jour Les boutons « Tous en journée » et « Tous absents » évitent soixante clics quand la classe est complète."}, {"id": "garderie--le-recapitulatif-du-mois-et-l-encaissement", "titre": "Le récapitulatif du mois et l'encaissement", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Le récapitulatif compte, pour chaque enfant, ses demi-journées et ses\n    journées, le dû, ce qui a été versé et ce qui reste. Le bouton\n    <b>Encaisser<\/b> de chaque ligne enregistre le règlement (montant, mode,\n    caisse) et imprime un ticket 80 mm. C'est le même chemin qu'un paiement au\n    guichet, avec les mêmes écritures.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Garderie, onglet Récapitulatif du mois : pour chaque enfant, demi-journées, journées, dû, versé et reste, avec un bouton Encaisser par ligne et le total en bas.\" decoding=\"async\" loading=\"lazy\" src=\"captures/garderie-recap.webp\"/>\n<figcaption><b>Garderie › Récapitulatif du mois<\/b><span>Juin aux Palmiers : la moitié des familles a déjà réglé à la caisse garderie.<\/span><\/figcaption>\n<\/figure>", "texte": "Le récapitulatif compte, pour chaque enfant, ses demi-journées et ses journées, le dû, ce qui a été versé et ce qui reste. Le bouton Encaisser de chaque ligne enregistre le règlement (montant, mode, caisse) et imprime un ticket 80 mm. C'est le même chemin qu'un paiement au guichet, avec les mêmes écritures. Garderie › Récapitulatif du mois Juin aux Palmiers : la moitié des familles a déjà réglé à la caisse garderie."}, {"id": "garderie--la-garde-du-soir", "titre": "La garde du soir", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Pour un enfant récupéré après l'heure limite, on saisit la date, le nom de\n    l'enfant et son <b>heure de départ<\/b>. Le logiciel calcule le nombre de\n    tranches et le montant selon les réglages de Paramètres › Échéances. Ce montant\n    s'ajoute au dû du mois de l'enfant. Il s'encaisse soit au guichet avec la\n    mensualité, soit tout de suite avec le bouton <b>Encaisser<\/b> de la ligne. Sur le reçu, il apparaît en toutes lettres (« dont garde du soir\n    2 000 F »).<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Garderie, onglet Garde du soir : règle de facturation rappelée en haut, saisie de la date, de l'enfant et de l'heure de départ, puis la liste des départs tardifs du jour.\" decoding=\"async\" loading=\"lazy\" src=\"captures/garderie-soir.webp\"/>\n<figcaption><b>Garderie › Garde du soir<\/b><span>Récupération jusqu'à 17 h 30, facturation à partir de 17 h 45 : un enfant parti à 18 h 20 compte deux tranches, soit 2 000 F.<\/span><\/figcaption>\n<\/figure><div class=\"alerte alerte-info\">\n<h4>Où va cet argent en comptabilité<\/h4>\n<p>La garderie, la garde du soir, la cantine et les activités sont des\n    <b>produits accessoires<\/b> (compte 758). Le compte 706 est réservé au service\n    éducatif : inscription, réinscription, mensualités. Le compte de résultat les\n    présente donc séparément, ce que l'expert-comptable attend.<\/p>\n<\/div>", "texte": "Pour un enfant récupéré après l'heure limite, on saisit la date, le nom de l'enfant et son heure de départ . Le logiciel calcule le nombre de tranches et le montant selon les réglages de Paramètres › Échéances. Ce montant s'ajoute au dû du mois de l'enfant. Il s'encaisse soit au guichet avec la mensualité, soit tout de suite avec le bouton Encaisser de la ligne. Sur le reçu, il apparaît en toutes lettres (« dont garde du soir 2 000 F »). Garderie › Garde du soir Récupération jusqu'à 17 h 30, facturation à partir de 17 h 45 : un enfant parti à 18 h 20 compte deux tranches, soit 2 000 F. Où va cet argent en comptabilité La garderie, la garde du soir, la cantine et les activités sont des produits accessoires (compte 758). Le compte 706 est réservé au service éducatif : inscription, réinscription, mensualités. Le compte de résultat les présente donc séparément, ce que l'expert-comptable attend."}]}, "paiements": {"id": "paiements", "titre": "Paiements", "court": "Paiements", "nouveau": false, "eyebrow": "", "chapeau": "C'est l'écran le plus utilisé de la journée. Chaque règlement\n  saisi ici produit d'un seul geste le reçu de la famille, la ligne du suivi\n  mensuel, l'écriture comptable et la mise à jour de l'alerte de l'élève.", "chapeau_texte": "C'est l'écran le plus utilisé de la journée. Chaque règlement saisi ici produit d'un seul geste le reçu de la famille, la ligne du suivi mensuel, l'écriture comptable et la mise à jour de l'alerte de l'élève.", "licences": [{"nom": "Essai", "inclus": true}, {"nom": "Basic", "inclus": true}, {"nom": "Pro", "inclus": true}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "<div class=\"texte\">\n<p>Quatre onglets : <b>Saisie des Paiements<\/b>, <b>Charges<\/b>, <b>Mon\n    cahier mensuel<\/b> et <b>Proformas<\/b>. Un bandeau jaune rappelle en\n    permanence la situation du mois : combien de familles n'ont pas encore payé,\n    ce qui reste à encaisser et les charges budgétées à régler.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Écran Saisie des Paiements : onglets, bandeau du mois, totaux par mode (espèces, Orange Money, Wave, virement), recherche, et historique des règlements.\" decoding=\"async\" loading=\"lazy\" src=\"captures/paiements-liste.webp\"/>\n<figcaption><b>Paiements<\/b><span>Les cartes du haut totalisent l'année par canal d'encaissement : aux Palmiers, 32 018 000 F en espèces, 12 239 500 F par Orange Money, 11 281 000 F par Wave.<\/span><\/figcaption>\n<\/figure>", "intro_texte": "Quatre onglets : Saisie des Paiements , Charges , Mon cahier mensuel et Proformas . Un bandeau jaune rappelle en permanence la situation du mois : combien de familles n'ont pas encore payé, ce qui reste à encaisser et les charges budgétées à régler. Paiements Les cartes du haut totalisent l'année par canal d'encaissement : aux Palmiers, 32 018 000 F en espèces, 12 239 500 F par Orange Money, 11 281 000 F par Wave.", "rubriques": [{"id": "paiements--encaisser-un-reglement", "titre": "Encaisser un règlement", "nouveau": false, "etape": false, "html": "<ol class=\"etapes\">\n<li><b>Nouveau Paiement<\/b>, puis <b>chercher l'élève<\/b> par nom, matricule\n    ou nom du père. La recherche affiche la section, la date de naissance, le\n    père et son téléphone, ainsi qu'une étiquette quand l'élève bénéficie d'une\n    prise en charge. De quoi départager deux homonymes sans quitter l'écran.<\/li>\n<li><b>Lire le bandeau de situation<\/b> : total annuel dû, déjà versé, reste\n    à payer. Le caissier voit tout avant d'encaisser.<\/li>\n<li><b>Choisir le type<\/b> : Inscription ou Mensualité.<\/li>\n<li><b>Cocher les mois concernés.<\/b> Les mois déjà réglés portent une coche.\n    Un parent qui paie trois mois d'avance en coche trois : le logiciel sait\n    alors que ces mois ne sont plus dus. <span class=\"badge-nouveau\">Nouveau<\/span> On\n    peut encaisser d'avance avant le début de l'année : le règlement se\n    rattache au premier mois.<\/li>\n<li><b>Vérifier les services<\/b> auxquels l'élève est abonné (cantine,\n    transport…). Ils sont proposés avec le montant des mois cochés, et les frais\n    d'adhésion la première fois.<\/li>\n<li><b>Saisir le montant versé.<\/b> Le logiciel indique aussitôt si l'échéance\n    est soldée ou s'il reste un reliquat.<\/li>\n<li><b>Préciser qui paie<\/b> (la famille ou un organisme boursier) et le\n    <b>mode<\/b>. Si la famille panache espèces et Wave, cochez <b>multi-mode<\/b>\n    et ventilez : chaque canal sera crédité du bon montant.\n    <span class=\"badge-nouveau\">Nouveau<\/span> Le règlement se répartit aussi dans les\n    cartes par mode de l'écran Paiements et dans la trésorerie par canal du\n    tableau de bord, au lieu d'une rubrique « Mixte ».\n    <span class=\"badge-nouveau\">Nouveau<\/span> Pour les espèces, choisissez la\n    <b>caisse<\/b> qui les reçoit.<\/li>\n<li><b>Enregistrer + Reçu<\/b> produit le PDF prêt à imprimer, au format A4,\n    A5 ou ticket 80 mm. <span class=\"badge-nouveau\">Nouveau<\/span> Chaque reçu porte\n    la ligne <b>Impayés antérieurs<\/b> : ce qui reste des années précédentes, ou\n    « Néant ». Le fichier porte le nom de l'élève, ce qui évite de\n    chercher parmi dix « recu.pdf ». <b>Enregistrer<\/b> seul convient quand la\n    famille ne veut pas de papier.<\/li>\n<\/ol><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Recherche d'un élève dans la fenêtre de saisie : plusieurs NDIAYE, chacun avec son matricule, sa section, sa date de naissance, son père et son téléphone.\" decoding=\"async\" loading=\"lazy\" src=\"captures/paiements-recherche.webp\"/>\n<figcaption><b>Recherche de l'élève<\/b><span>Plusieurs NDIAYE : le matricule et le nom du père tranchent.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Formulaire de paiement : bandeau de situation, type Mensualité, mois déjà réglés cochés, juin restant, montant de la mensualité, cantine incluse.\" decoding=\"async\" loading=\"lazy\" src=\"captures/paiements-formulaire.webp\"/>\n<figcaption><b>Formulaire<\/b><span>Huit mois réglés, juin reste : 30 000 F de mensualité et 12 000 F de cantine.<\/span><\/figcaption>\n<\/figure>\n<\/div><div class=\"duo\">\n<figure class=\"capture document\">\n<img alt=\"Reçu officiel A5 : en-tête de l'établissement, élève, détail du paiement (mensualité et cantine), total encaissé, et suivi financier de l'exercice.\" decoding=\"async\" loading=\"lazy\" src=\"captures/doc-recu-a5.webp\"/>\n<figcaption><b>Reçu A5<\/b><span>Il répond aux trois questions du parent : ce qu'il vient de payer, ce qu'il a déjà payé, ce qui lui reste.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture document\">\n<img alt=\"Reçu au format ticket 80 mm : logo, élève, matricule, section, montants, mode, total attendu, déjà versé, versé ce jour et reste à payer.\" decoding=\"async\" loading=\"lazy\" src=\"captures/doc-recu-ticket.webp\"/>\n<figcaption><b>Ticket 80 mm<\/b><span>Pour les imprimantes de caisse. Le numéro de reçu est séquentiel et propre à l'école.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "Nouveau Paiement , puis chercher l'élève par nom, matricule ou nom du père. La recherche affiche la section, la date de naissance, le père et son téléphone, ainsi qu'une étiquette quand l'élève bénéficie d'une prise en charge. De quoi départager deux homonymes sans quitter l'écran. Lire le bandeau de situation : total annuel dû, déjà versé, reste à payer. Le caissier voit tout avant d'encaisser. Choisir le type : Inscription ou Mensualité. Cocher les mois concernés. Les mois déjà réglés portent une coche. Un parent qui paie trois mois d'avance en coche trois : le logiciel sait alors que ces mois ne sont plus dus. Nouveau On peut encaisser d'avance avant le début de l'année : le règlement se rattache au premier mois. Vérifier les services auxquels l'élève est abonné (cantine, transport…). Ils sont proposés avec le montant des mois cochés, et les frais d'adhésion la première fois. Saisir le montant versé. Le logiciel indique aussitôt si l'échéance est soldée ou s'il reste un reliquat. Préciser qui paie (la famille ou un organisme boursier) et le mode . Si la famille panache espèces et Wave, cochez multi-mode et ventilez : chaque canal sera crédité du bon montant. Nouveau Le règlement se répartit aussi dans les cartes par mode de l'écran Paiements et dans la trésorerie par canal du tableau de bord, au lieu d'une rubrique « Mixte ». Nouveau Pour les espèces, choisissez la caisse qui les reçoit. Enregistrer + Reçu produit le PDF prêt à imprimer, au format A4, A5 ou ticket 80 mm. Nouveau Chaque reçu porte la ligne Impayés antérieurs : ce qui reste des années précédentes, ou « Néant ». Le fichier porte le nom de l'élève, ce qui évite de chercher parmi dix « recu.pdf ». Enregistrer seul convient quand la famille ne veut pas de papier. Recherche de l'élève Plusieurs NDIAYE : le matricule et le nom du père tranchent. Formulaire Huit mois réglés, juin reste : 30 000 F de mensualité et 12 000 F de cantine. Reçu A5 Il répond aux trois questions du parent : ce qu'il vient de payer, ce qu'il a déjà payé, ce qui lui reste. Ticket 80 mm Pour les imprimantes de caisse. Le numéro de reçu est séquentiel et propre à l'école."}, {"id": "paiements--annuler-ou-corriger-un-reglement", "titre": "Annuler ou corriger un règlement", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Un reçu ne s'efface jamais : le SYSCOHADA l'interdit. Deux gestes sont\n    possibles depuis la ligne du règlement :<\/p>\n<\/div><ul class=\"puces\">\n<li><b>Annuler<\/b> : le règlement passe au statut Annulé et le logiciel écrit\n    des contre-écritures qui neutralisent les premières. La trace des deux reste\n    au journal.<\/li>\n<li><b>Modifier<\/b> : même mécanique, suivie de l'enregistrement du bon\n    montant. C'est la seule façon de rectifier une erreur de saisie.<\/li>\n<\/ul>", "texte": "Un reçu ne s'efface jamais : le SYSCOHADA l'interdit. Deux gestes sont possibles depuis la ligne du règlement : Annuler : le règlement passe au statut Annulé et le logiciel écrit des contre-écritures qui neutralisent les premières. La trace des deux reste au journal. Modifier : même mécanique, suivie de l'enregistrement du bon montant. C'est la seule façon de rectifier une erreur de saisie."}, {"id": "paiements--mon-cahier-mensuel", "titre": "Mon cahier mensuel", "nouveau": true, "etape": false, "html": "<div class=\"texte\">\n<p>C'est le cahier que tient le caissier, mais tenu tout seul. Pour le mois\n    choisi, il affiche ce qui devait entrer, ce qui est entré, ce qui reste,\n    l'argent réellement entré en caisse, et les charges budgétées à régler.\n    Dessous, la liste nominative se filtre : <b>Pas encore payé<\/b>,\n    <b>Partiel<\/b>, <b>Déjà payé<\/b>, <b>Charges budgétées<\/b>. Chaque ligne donne\n    le téléphone à appeler. Le bouton <b>Télécharger le PDF<\/b> sort la liste de\n    relance du mois.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Mon cahier mensuel : juin 2026, bandeau rouge du mois clôturé, cartes Devait entrer, Est entré, Reste à encaisser, Entré en caisse, Charges budgétées, Solde du mois, puis la liste des élèves qui n'ont pas encore payé.\" decoding=\"async\" loading=\"lazy\" src=\"captures/paiements-cahier.webp\"/>\n<figcaption><b>Paiements › Mon cahier mensuel<\/b><span>Le lundi matin, la liste des familles à appeler est déjà prête. Le compteur rouge sur l'onglet est le nombre de familles sans paiement ce mois-ci.<\/span><\/figcaption>\n<\/figure>", "texte": "C'est le cahier que tient le caissier, mais tenu tout seul. Pour le mois choisi, il affiche ce qui devait entrer, ce qui est entré, ce qui reste, l'argent réellement entré en caisse, et les charges budgétées à régler. Dessous, la liste nominative se filtre : Pas encore payé , Partiel , Déjà payé , Charges budgétées . Chaque ligne donne le téléphone à appeler. Le bouton Télécharger le PDF sort la liste de relance du mois. Paiements › Mon cahier mensuel Le lundi matin, la liste des familles à appeler est déjà prête. Le compteur rouge sur l'onglet est le nombre de familles sans paiement ce mois-ci."}, {"id": "paiements--proformas", "titre": "Proformas", "nouveau": true, "etape": false, "html": "<div class=\"texte\">\n<p>Une facture proforma chiffre ce qu'une famille aura à payer, sans rien\n    encaisser ni rien écrire en comptabilité. Deux cas : une famille qui veut\n    régler le reste de l'année d'un coup (le chiffrage part alors de\n    l'échéancier réel de l'élève), ou une famille qui se renseigne avant\n    l'inscription (on choisit la section, la date d'entrée et les services, et\n    le prorata est calculé). Une remise peut être accordée pour un règlement en\n    une fois. Chaque proforma porte un numéro <span class=\"mono\">PF-AAAA-NNNN<\/span>\n    et une date de validité.<\/p>\n<\/div><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Proformas : liste des factures proforma émises avec numéro, date, élève, classe, parent, net à payer et validité.\" decoding=\"async\" loading=\"lazy\" src=\"captures/paiements-proformas.webp\"/>\n<figcaption><b>Paiements › Proformas<\/b><span>Document non comptable : rien n'est encaissé.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture document\">\n<img alt=\"Facture proforma PDF : établissement, élève, désignations avec quantités, prix et montants, net à payer, modalités de règlement et conditions.\" decoding=\"async\" loading=\"lazy\" src=\"captures/doc-proforma.webp\"/>\n<figcaption><b>Proforma PDF<\/b><span>À remettre au parent ou à son employeur.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "Une facture proforma chiffre ce qu'une famille aura à payer, sans rien encaisser ni rien écrire en comptabilité. Deux cas : une famille qui veut régler le reste de l'année d'un coup (le chiffrage part alors de l'échéancier réel de l'élève), ou une famille qui se renseigne avant l'inscription (on choisit la section, la date d'entrée et les services, et le prorata est calculé). Une remise peut être accordée pour un règlement en une fois. Chaque proforma porte un numéro PF-AAAA-NNNN et une date de validité. Paiements › Proformas Document non comptable : rien n'est encaissé. Proforma PDF À remettre au parent ou à son employeur."}, {"id": "paiements--charges", "titre": "Charges", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>L'onglet Charges enregistre les <b>dépenses de fonctionnement<\/b> : loyer,\n    électricité, eau, internet, entretien, fournitures. On saisit le libellé, le\n    montant, la date et le canal de règlement ; le logiciel propose le compte\n    comptable d'après le libellé et écrit lui-même les écritures.\n    <span class=\"badge-nouveau\">Nouveau<\/span> Sous le compte, il indique le mot qui l'a\n    reconnu (« SDE » → 6051 Eau). Un libellé qu'il ne comprend pas part en\n    <b>658 Charges diverses<\/b>, jamais sur un compte arbitraire. L'import Excel\n    classe les libellés exactement de la même façon. Les pièces\n    justificatives (facture, reçu) s'attachent à la charge avec le trombone. Un\n    <b>import Excel<\/b> permet de reprendre un cahier de dépenses existant.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Charges : total de l'exercice, recherche, puis la liste des charges avec date, numéro de pièce, compte, libellé et montant, et les boutons pièces jointes, modifier et annuler.\" decoding=\"async\" loading=\"lazy\" src=\"captures/paiements-charges.webp\"/>\n<figcaption><b>Paiements › Charges<\/b><span>Le compte proposé d'après le libellé figure dans la troisième colonne. Chaque charge a son numéro de pièce CHG.<\/span><\/figcaption>\n<\/figure>", "texte": "L'onglet Charges enregistre les dépenses de fonctionnement : loy
