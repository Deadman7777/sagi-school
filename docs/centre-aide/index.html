er, électricité, eau, internet, entretien, fournitures. On saisit le libellé, le montant, la date et le canal de règlement ; le logiciel propose le compte comptable d'après le libellé et écrit lui-même les écritures. Nouveau Sous le compte, il indique le mot qui l'a reconnu (« SDE » → 6051 Eau). Un libellé qu'il ne comprend pas part en 658 Charges diverses , jamais sur un compte arbitraire. L'import Excel classe les libellés exactement de la même façon. Les pièces justificatives (facture, reçu) s'attachent à la charge avec le trombone. Un import Excel permet de reprendre un cahier de dépenses existant. Paiements › Charges Le compte proposé d'après le libellé figure dans la troisième colonne. Chaque charge a son numéro de pièce CHG."}]}, "suivi": {"id": "suivi", "titre": "Suivi mensuel", "court": "Suivi mensuel", "nouveau": false, "eyebrow": "", "chapeau": "C'est le module de pilotage du recouvrement. Il répond aux\n  quatre questions que la direction se pose chaque mois : combien devait-on\n  encaisser, combien a-t-on encaissé, qui n'a pas payé, et reste-t-il une marge\n  une fois les charges payées ?", "chapeau_texte": "C'est le module de pilotage du recouvrement. Il répond aux quatre questions que la direction se pose chaque mois : combien devait-on encaisser, combien a-t-on encaissé, qui n'a pas payé, et reste-t-il une marge une fois les charges payées ?", "licences": [{"nom": "Essai", "inclus": true}, {"nom": "Basic", "inclus": true}, {"nom": "Pro", "inclus": true}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "", "intro_texte": "", "rubriques": [{"id": "suivi--evolution-mensuelle", "titre": "Évolution mensuelle", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Mois par mois : la scolarité envisagée, ce qui a été encaissé, ce qui reste\n    et le taux de recouvrement. C'est ce tableau qui montre à une direction que son\n    recouvrement s'effondre en mai, bien avant que la trésorerie ne le lui\n    apprenne. Les onglets suivants détaillent par section, par élève, et listent\n    les plus gros impayés.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Évolution mensuelle : élèves inscrits, total attendu, encaissé, reste et taux de recouvrement, puis le tableau de la scolarité à encaisser par mois.\" decoding=\"async\" loading=\"lazy\" src=\"captures/suivi-evolution.webp\"/>\n<figcaption><b>Suivi mensuel › Évolution mensuelle<\/b><span>Aux Palmiers, le taux passe de plus de 85 % à l'automne à environ 55 % en juin : un décrochage visible d'un coup d'œil.<\/span><\/figcaption>\n<\/figure><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Par section : effectif, total attendu, encaissé, reste et taux de recouvrement pour le Collège, la Garderie, la Maternelle et l'Élémentaire.\" decoding=\"async\" loading=\"lazy\" src=\"captures/suivi-sections.webp\"/>\n<figcaption><b>Par section<\/b><span>Où se concentre l'impayé.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Onglet Créances : les vingt élèves ayant le plus gros solde impayé, avec section, attendu, payé, reste et progression.\" decoding=\"async\" loading=\"lazy\" src=\"captures/suivi-creances.webp\"/>\n<figcaption><b>Créances<\/b><span>Les vingt plus gros soldes, prêts à être relancés.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "Mois par mois : la scolarité envisagée, ce qui a été encaissé, ce qui reste et le taux de recouvrement. C'est ce tableau qui montre à une direction que son recouvrement s'effondre en mai, bien avant que la trésorerie ne le lui apprenne. Les onglets suivants détaillent par section, par élève, et listent les plus gros impayés. Suivi mensuel › Évolution mensuelle Aux Palmiers, le taux passe de plus de 85 % à l'automne à environ 55 % en juin : un décrochage visible d'un coup d'œil. Par section Où se concentre l'impayé. Créances Les vingt plus gros soldes, prêts à être relancés."}, {"id": "suivi--charges-marge", "titre": "Charges & Marge", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>C'est le seul écran qui rapproche mois par mois ce qui est entré, ce qui\n    est sorti en charges, ce qui est parti en investissement, et ce qui reste. Une\n    marge négative en début d'année n'a rien d'alarmant, car les investissements\n    de rentrée pèsent lourd. En revanche, une marge cumulée qui ne repasse jamais\n    au positif est un signal que la direction doit voir tôt.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Charges et Marge : charges opérationnelles, investissements et marge nette, puis le tableau mensuel des encaissements, charges, investissements, décaissements, marge et marge cumulée.\" decoding=\"async\" loading=\"lazy\" src=\"captures/suivi-charges.webp\"/>\n<figcaption><b>Suivi mensuel › Charges &amp; Marge<\/b><span>Octobre concentre le minibus et le parc informatique : l'investissement pèse sur la marge de trésorerie du mois où il est payé.<\/span><\/figcaption>\n<\/figure><div class=\"alerte alerte-info\">\n<h4>Marge de trésorerie et résultat comptable ne sont pas le même chiffre<\/h4>\n<p>Un investissement fait sortir toute la trésorerie l'année de l'achat, mais\n    ne pèse sur le résultat que par son amortissement annuel. Le minibus des\n    Palmiers coûte 12 500 000 F en caisse en octobre, et 2 500 000 F de charge par\n    an pendant cinq ans. D'où une marge de trésorerie faible à côté d'un résultat\n    comptable nettement bénéficiaire. Les deux sont justes.<\/p>\n<p>C'est l'explication qu'un directeur réclame chaque année : elle se lit\n    avec les deux écrans côte à côte.<\/p>\n<\/div>", "texte": "C'est le seul écran qui rapproche mois par mois ce qui est entré, ce qui est sorti en charges, ce qui est parti en investissement, et ce qui reste. Une marge négative en début d'année n'a rien d'alarmant, car les investissements de rentrée pèsent lourd. En revanche, une marge cumulée qui ne repasse jamais au positif est un signal que la direction doit voir tôt. Suivi mensuel › Charges & Marge Octobre concentre le minibus et le parc informatique : l'investissement pèse sur la marge de trésorerie du mois où il est payé. Marge de trésorerie et résultat comptable ne sont pas le même chiffre Un investissement fait sortir toute la trésorerie l'année de l'achat, mais ne pèse sur le résultat que par son amortissement annuel. Le minibus des Palmiers coûte 12 500 000 F en caisse en octobre, et 2 500 000 F de charge par an pendant cinq ans. D'où une marge de trésorerie faible à côté d'un résultat comptable nettement bénéficiaire. Les deux sont justes. C'est l'explication qu'un directeur réclame chaque année : elle se lit avec les deux écrans côte à côte."}]}, "comptabilite": {"id": "comptabilite", "titre": "Comptabilité", "court": "Comptabilité", "nouveau": false, "eyebrow": "", "chapeau": "Une comptabilité SYSCOHADA Révisé complète, alimentée\n  uniquement par les autres modules. Aucune écriture ne se saisit ici : on lit,\n  on contrôle, on imprime.", "chapeau_texte": "Une comptabilité SYSCOHADA Révisé complète, alimentée uniquement par les autres modules. Aucune écriture ne se saisit ici : on lit, on contrôle, on imprime.", "licences": [{"nom": "Essai", "inclus": true}, {"nom": "Basic", "inclus": false}, {"nom": "Pro", "inclus": true}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "<div class=\"texte\">\n<p>Chaque opération métier produit ses écritures en partie double au moment où\n    elle est enregistrée. Un règlement de scolarité constate la créance sur la\n    famille, le produit de l'exercice et l'encaissement sur le bon canal de\n    trésorerie, puis solde la créance. Une charge écrit la dette fournisseur, puis\n    son règlement. Un bulletin de paie écrit le salaire brut, les cotisations\n    salariales et patronales, les retenues fiscales et le net versé.<\/p>\n<p>Le comptable de l'école n'a donc pas besoin de connaître le plan SYSCOHADA\n    pour que la comptabilité soit juste. Il doit savoir la <b>lire<\/b>, et c'est\n    ce que la formation lui apprend.<\/p>\n<\/div><div class=\"texte\">\n<p>Huit onglets : <b>Journal<\/b>, <b>Grand Livre<\/b>, <b>Balance<\/b>,\n    <b>ETAFI<\/b> (les quatre états de synthèse), <b>Historique<\/b>, <b>Plan\n    Comptable<\/b>, <b>Budget<\/b> et <b>Investissement<\/b>. Le sélecteur\n    <b>Exercice<\/b>, en haut, permet de relire une année clôturée, en lecture\n    seule. Le bouton <b>Exporter PDF<\/b> s'adapte à l'onglet ouvert.<\/p>\n<\/div>", "intro_texte": "Chaque opération métier produit ses écritures en partie double au moment où elle est enregistrée. Un règlement de scolarité constate la créance sur la famille, le produit de l'exercice et l'encaissement sur le bon canal de trésorerie, puis solde la créance. Une charge écrit la dette fournisseur, puis son règlement. Un bulletin de paie écrit le salaire brut, les cotisations salariales et patronales, les retenues fiscales et le net versé. Le comptable de l'école n'a donc pas besoin de connaître le plan SYSCOHADA pour que la comptabilité soit juste. Il doit savoir la lire , et c'est ce que la formation lui apprend. Huit onglets : Journal , Grand Livre , Balance , ETAFI (les quatre états de synthèse), Historique , Plan Comptable , Budget et Investissement . Le sélecteur Exercice , en haut, permet de relire une année clôturée, en lecture seule. Le bouton Exporter PDF s'adapte à l'onglet ouvert.", "rubriques": [{"id": "comptabilite--journal-grand-livre-et-balance", "titre": "Journal, grand livre et balance", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Le <b>journal<\/b> présente toutes les écritures dans l'ordre chronologique,\n    avec leur origine. Les filtres du haut isolent une famille d'opérations :\n    Paie, Scolarité, Charges, Avances, Investissement, Amortissement, Budget\n    mensuel.<\/p>\n<p>Le <b>grand livre<\/b> regroupe les écritures par compte, avec les totaux au\n    débit et au crédit et le solde. La <b>balance<\/b> reprend les mêmes comptes\n    classés par classe SYSCOHADA, avec les soldes d'ouverture, les mouvements de la\n    période et les soldes de clôture. C'est le document que réclame\n    l'expert-comptable.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Journal : filtres par nature d'opération et liste chronologique des écritures avec source, date, numéro de pièce, compte, libellé, débit et crédit.\" decoding=\"async\" loading=\"lazy\" src=\"captures/compta-journal.webp\"/>\n<figcaption><b>Comptabilité › Journal<\/b><span>La colonne <i>Source<\/i> indique d'où vient chaque écriture. C'est la piste d'audit : depuis une ligne du journal, on remonte toujours à l'opération qui l'a produite.<\/span><\/figcaption>\n<\/figure><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Grand Livre : liste des comptes avec libellé, total débit, total crédit, solde débiteur et solde créditeur.\" decoding=\"async\" loading=\"lazy\" src=\"captures/compta-grand-livre.webp\"/>\n<figcaption><b>Grand Livre<\/b><span>Un compte, ses mouvements, son solde.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Onglet Balance : comptes groupés par classe SYSCOHADA avec soldes d'ouverture, mouvements et soldes de clôture.\" decoding=\"async\" loading=\"lazy\" src=\"captures/compta-balance.webp\"/>\n<figcaption><b>Balance<\/b><span>Classée par classe, du capital à la trésorerie.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "Le journal présente toutes les écritures dans l'ordre chronologique, avec leur origine. Les filtres du haut isolent une famille d'opérations : Paie, Scolarité, Charges, Avances, Investissement, Amortissement, Budget mensuel. Le grand livre regroupe les écritures par compte, avec les totaux au débit et au crédit et le solde. La balance reprend les mêmes comptes classés par classe SYSCOHADA, avec les soldes d'ouverture, les mouvements de la période et les soldes de clôture. C'est le document que réclame l'expert-comptable. Comptabilité › Journal La colonne Source indique d'où vient chaque écriture. C'est la piste d'audit : depuis une ligne du journal, on remonte toujours à l'opération qui l'a produite. Grand Livre Un compte, ses mouvements, son solde. Balance Classée par classe, du capital à la trésorerie."}, {"id": "comptabilite--les-comptes-a-connaitre", "titre": "Les comptes à connaître", "nouveau": false, "etape": false, "html": "<div class=\"defile\">\n<table>\n<thead><tr><th>Compte<\/th><th>Ce qu'il porte<\/th><\/tr><\/thead>\n<tbody>\n<tr><td class=\"mono\">411<\/td><td>Ce que doivent les familles.<\/td><\/tr>\n<tr><td class=\"mono\">4112<\/td><td>Ce que doivent les organismes boursiers.<\/td><\/tr>\n<tr><td class=\"mono\">706<\/td><td>Le service éducatif : inscription, réinscription, mensualités.<\/td><\/tr>\n<tr><td class=\"mono\">758<\/td><td><span class=\"badge-nouveau\">Nouveau<\/span> Les produits accessoires : cantine, garderie, garde du soir, activités, assurance.<\/td><\/tr>\n<tr><td class=\"mono\">571 · 5716…<\/td><td>La caisse principale et les caisses par service.<\/td><\/tr>\n<tr><td class=\"mono\">521 · 5521…<\/td><td>La banque, Wave, Orange Money et les autres canaux mobiles.<\/td><\/tr>\n<tr><td class=\"mono\">890<\/td><td>Les à-nouveaux : dettes reprises d'une année précédente.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div>", "texte": "Compte Ce qu'il porte 411 Ce que doivent les familles. 4112 Ce que doivent les organismes boursiers. 706 Le service éducatif : inscription, réinscription, mensualités. 758 Nouveau Les produits accessoires : cantine, garderie, garde du soir, activités, assurance. 571 · 5716… La caisse principale et les caisses par service. 521 · 5521… La banque, Wave, Orange Money et les autres canaux mobiles. 890 Les à-nouveaux : dettes reprises d'une année précédente."}, {"id": "comptabilite--etafi-les-etats-financiers-de-synthese", "titre": "ETAFI — les états financiers de synthèse", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Quatre états sont produits automatiquement et s'exportent en PDF :<\/p>\n<\/div><ul class=\"puces\">\n<li><b>Bilan<\/b> : actif immobilisé, actif circulant et trésorerie d'un\n    côté ; capitaux propres, dettes financières et passif circulant de\n    l'autre.<\/li>\n<li><b>Compte de résultat<\/b> : produits, charges et résultat net.<\/li>\n<li><b>Flux de trésorerie<\/b> : flux d'exploitation, d'investissement et de\n    financement.<\/li>\n<li><b>Notes annexes<\/b>.<\/li>\n<\/ul><div class=\"texte\">\n<p>Le logiciel détecte seul le <b>système applicable<\/b> (normal ou minimal\n    de trésorerie) d'après le chiffre d'affaires de l'exercice, et adapte la\n    présentation.<\/p>\n<\/div><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Sous-onglet Bilan : actif immobilisé et actif circulant face aux capitaux propres, dettes financières et passif circulant, avec le bandeau Équilibré.\" decoding=\"async\" loading=\"lazy\" src=\"captures/compta-bilan.webp\"/>\n<figcaption><b>ETAFI › Bilan<\/b><span>Le bandeau <i>Équilibré<\/i> en haut à droite est le premier contrôle d'un comptable.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Sous-onglet Compte de résultat : produits (scolarité, subventions, produits divers, dons) et charges détaillées par compte.\" decoding=\"async\" loading=\"lazy\" src=\"captures/compta-resultat.webp\"/>\n<figcaption><b>ETAFI › Compte de résultat<\/b><span>La scolarité (706) et les produits divers d'exploitation (758) apparaissent sur deux lignes distinctes.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "Quatre états sont produits automatiquement et s'exportent en PDF : Bilan : actif immobilisé, actif circulant et trésorerie d'un côté ; capitaux propres, dettes financières et passif circulant de l'autre. Compte de résultat : produits, charges et résultat net. Flux de trésorerie : flux d'exploitation, d'investissement et de financement. Notes annexes . Le logiciel détecte seul le système applicable (normal ou minimal de trésorerie) d'après le chiffre d'affaires de l'exercice, et adapte la présentation. ETAFI › Bilan Le bandeau Équilibré en haut à droite est le premier contrôle d'un comptable. ETAFI › Compte de résultat La scolarité (706) et les produits divers d'exploitation (758) apparaissent sur deux lignes distinctes."}, {"id": "comptabilite--budget", "titre": "Budget", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Le budget prévisionnel se saisit poste par poste et mois par mois. En face,\n    le logiciel affiche le <b>réalisé<\/b> tiré des écritures, et l'écart. Une ligne\n    dont le réalisé dépasse la prévision ressort immédiatement. Le réalisé est\n    <b>net<\/b> : une charge annulée n'y compte plus. Une ligne peut être rattachée\n    à un projet et à une ressource (voir <a href=\"#gouvernance\">Gouvernance<\/a>).<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Budget : charges fixes et variables prévues face au réalisé, taux de réalisation global, puis un suivi mensuel budgété contre réalisé.\" decoding=\"async\" loading=\"lazy\" src=\"captures/compta-budget.webp\"/>\n<figcaption><b>Comptabilité › Budget<\/b><span>Un taux de réalisation au-dessus de 100 % n'est pas forcément une mauvaise nouvelle, mais c'est toujours une discussion à avoir avec la direction.<\/span><\/figcaption>\n<\/figure>", "texte": "Le budget prévisionnel se saisit poste par poste et mois par mois. En face, le logiciel affiche le réalisé tiré des écritures, et l'écart. Une ligne dont le réalisé dépasse la prévision ressort immédiatement. Le réalisé est net : une charge annulée n'y compte plus. Une ligne peut être rattachée à un projet et à une ressource (voir Gouvernance ). Comptabilité › Budget Un taux de réalisation au-dessus de 100 % n'est pas forcément une mauvaise nouvelle, mais c'est toujours une discussion à avoir avec la direction."}, {"id": "comptabilite--investissement", "titre": "Investissement", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Les biens durables (véhicule, mobilier, informatique, bâtiment) ne sont pas\n    des charges. On les enregistre ici avec leur valeur d'entrée et leur durée\n    d'utilisation ; le logiciel calcule l'annuité d'amortissement, tient la valeur\n    nette comptable et écrit la dotation. Le règlement peut être immédiat ou\n    différé, et payé sur plusieurs canaux.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Investissement : valeur brute, cumul des amortissements, valeur nette, puis la liste des immobilisations.\" decoding=\"async\" loading=\"lazy\" src=\"captures/compta-investissement.webp\"/>\n<figcaption><b>Comptabilité › Investissement<\/b><span>Quatre biens pour 19 250 000 FCFA de valeur brute : minibus, parc informatique, tables-bancs et photocopieur.<\/span><\/figcaption>\n<\/figure><div class=\"alerte alerte-piege\">\n<h4>Charge ou investissement ?<\/h4>\n<p>La règle enseignée en formation : si le bien sert <b>au-delà de l'année\n    scolaire<\/b>, c'est un investissement. Une ramette de papier est une charge ;\n    soixante tables-bancs sont un investissement. Passer un minibus en charge\n    écrase le résultat de l'année et fait disparaître le bien du bilan.<\/p>\n<\/div>", "texte": "Les biens durables (véhicule, mobilier, informatique, bâtiment) ne sont pas des charges. On les enregistre ici avec leur valeur d'entrée et leur durée d'utilisation ; le logiciel calcule l'annuité d'amortissement, tient la valeur nette comptable et écrit la dotation. Le règlement peut être immédiat ou différé, et payé sur plusieurs canaux. Comptabilité › Investissement Quatre biens pour 19 250 000 FCFA de valeur brute : minibus, parc informatique, tables-bancs et photocopieur. Charge ou investissement ? La règle enseignée en formation : si le bien sert au-delà de l'année scolaire , c'est un investissement. Une ramette de papier est une charge ; soixante tables-bancs sont un investissement. Passer un minibus en charge écrase le résultat de l'année et fait disparaître le bien du bilan."}]}, "fiscal": {"id": "fiscal", "titre": "Fiscal & BRS", "court": "Fiscal & BRS", "nouveau": false, "eyebrow": "", "chapeau": "Le module qui dit à l'établissement ce qu'il doit à\n  l'administration, quand, et sur quelle base. Le calcul se fait sur ses propres\n  écritures, selon le cadre fiscal sénégalais.", "chapeau_texte": "Le module qui dit à l'établissement ce qu'il doit à l'administration, quand, et sur quelle base. Le calcul se fait sur ses propres écritures, selon le cadre fiscal sénégalais.", "licences": [{"nom": "Essai", "inclus": false}, {"nom": "Basic", "inclus": false}, {"nom": "Pro", "inclus": false}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "<div class=\"texte\">\n<p>Trois onglets : <b>Déclarations sociales<\/b>, <b>Obligations de\n    l'établissement<\/b> et <b>Conseils<\/b>.<\/p>\n<\/div>", "intro_texte": "Trois onglets : Déclarations sociales , Obligations de l'établissement et Conseils .", "rubriques": [{"id": "fiscal--declarations-sociales", "titre": "Déclarations sociales", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Le bordereau de règlement des salaires (BRS), mois par mois : masse\n    salariale brute, IPRES salarial et patronal, CSS et ATMP, IR retenu, CFCE,\n    total à verser, date limite et statut. Les chiffres viennent des bulletins de\n    paie <b>validés<\/b> dans le module RH.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Déclarations sociales : masse salariale, BRS dû, impôts et cotisations, retards, puis le bordereau mensuel avec IPRES, CSS et ATMP, IR, CFCE, total, date limite et statut.\" decoding=\"async\" loading=\"lazy\" src=\"captures/fiscal-declarations.webp\"/>\n<figcaption><b>Fiscal › Déclarations sociales<\/b><span>Chaque mois porte sa date limite, le 15 du mois suivant.<\/span><\/figcaption>\n<\/figure>", "texte": "Le bordereau de règlement des salaires (BRS), mois par mois : masse salariale brute, IPRES salarial et patronal, CSS et ATMP, IR retenu, CFCE, total à verser, date limite et statut. Les chiffres viennent des bulletins de paie validés dans le module RH. Fiscal › Déclarations sociales Chaque mois porte sa date limite, le 15 du mois suivant."}, {"id": "fiscal--obligations-de-l-etablissement", "titre": "Obligations de l'établissement", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Le calcul s'active dès que le RCCM et le NINEA sont renseignés dans\n    Paramètres. Chaque obligation est présentée avec sa base, son taux, son\n    montant, sa périodicité et son échéance.<\/p>\n<\/div><div class=\"defile\">\n<table>\n<thead><tr><th>Obligation<\/th><th>Base retenue<\/th><th>Échéance<\/th><\/tr><\/thead>\n<tbody>\n<tr><td><b>IS / IMF<\/b><\/td><td>30 % du résultat estimé, ou l'impôt minimum forfaitaire (0,5 % des produits, avec un plancher de 500 000 F et un plafond de 5 000 000 F) s'il est plus élevé.<\/td><td>Acomptes le 15 février et le 30 avril, solde avec la déclaration.<\/td><\/tr>\n<tr><td><b>CFCE<\/b><\/td><td>Pourcentage de la masse salariale brute, au taux fixé dans RH › Paramètres fiscaux. Comptabilisée automatiquement à la validation des bulletins.<\/td><td>Mensuelle, avec le BRS.<\/td><\/tr>\n<tr><td><b>TVA<\/b><\/td><td>L'enseignement scolaire et universitaire est exonéré. Les activités annexes (cantine, transport) peuvent être taxables.<\/td><td>Mensuelle si applicable.<\/td><\/tr>\n<tr><td><b>CEL<\/b><\/td><td>Contribution économique locale, ex-patente. Le logiciel n'en connaît pas les bases : le montant se saisit d'après l'avis de la collectivité.<\/td><td>Annuelle.<\/td><\/tr>\n<tr><td><b>Retenues sur salaires<\/b><\/td><td>IR, TRIMF, IPRES et CSS, calculées et comptabilisées par le module RH à la validation des bulletins.<\/td><td>Le 15 du mois suivant, avec le BRS.<\/td><\/tr>\n<\/tbody>\n<\/table>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Obligations : produits, charges, résultat estimé et masse salariale, puis le détail de l'IS, de la CFCE et de la TVA.\" decoding=\"async\" loading=\"lazy\" src=\"captures/fiscal-obligations.webp\"/>\n<figcaption><b>Fiscal › Obligations<\/b><span>Le bouton <i>Comptabiliser<\/i> de l'IS écrit la charge d'impôt et la dette envers l'État. Le logiciel sait ce qui a déjà été comptabilisé et ne le compte pas deux fois.<\/span><\/figcaption>\n<\/figure>", "texte": "Le calcul s'active dès que le RCCM et le NINEA sont renseignés dans Paramètres. Chaque obligation est présentée avec sa base, son taux, son montant, sa périodicité et son échéance. Obligation Base retenue Échéance IS / IMF 30 % du résultat estimé, ou l'impôt minimum forfaitaire (0,5 % des produits, avec un plancher de 500 000 F et un plafond de 5 000 000 F) s'il est plus élevé. Acomptes le 15 février et le 30 avril, solde avec la déclaration. CFCE Pourcentage de la masse salariale brute, au taux fixé dans RH › Paramètres fiscaux. Comptabilisée automatiquement à la validation des bulletins. Mensuelle, avec le BRS. TVA L'enseignement scolaire et universitaire est exonéré. Les activités annexes (cantine, transport) peuvent être taxables. Mensuelle si applicable. CEL Contribution économique locale, ex-patente. Le logiciel n'en connaît pas les bases : le montant se saisit d'après l'avis de la collectivité. Annuelle. Retenues sur salaires IR, TRIMF, IPRES et CSS, calculées et comptabilisées par le module RH à la validation des bulletins. Le 15 du mois suivant, avec le BRS. Fiscal › Obligations Le bouton Comptabiliser de l'IS écrit la charge d'impôt et la dette envers l'État. Le logiciel sait ce qui a déjà été comptabilisé et ne le compte pas deux fois."}, {"id": "fiscal--conseils", "titre": "Conseils", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Le logiciel surveille la situation de l'établissement et fait remonter ce\n    qu'il faut faire : un BRS à déposer avant le 15, une provision d'impôt à\n    constituer parce que le résultat est positif, un exercice échu à clôturer, des\n    impayés à suivre. Chaque conseil est classé <i>Attention<\/i> ou\n    <i>Info<\/i> et rattaché à son domaine.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Conseils : recommandations classées par domaine fiscal, comptable ou financier, avec un niveau Attention ou Info.\" decoding=\"async\" loading=\"lazy\" src=\"captures/fiscal-conseils.webp\"/>\n<figcaption><b>Fiscal › Conseils<\/b><span>Les premiers conseils remontent aussi sur le tableau de bord : la direction est prévenue sans ouvrir le module.<\/span><\/figcaption>\n<\/figure><div class=\"alerte alerte-info\">\n<h4>Ce que le module n'est pas<\/h4>\n<p>C'est une aide au pilotage, pas un cabinet fiscal. Les montants sont des\n    <b>estimations<\/b> calculées sur les écritures de l'école : ils remplacent un\n    tableur, pas l'avis d'un expert-comptable. Le dire clairement en formation\n    évite un malentendu coûteux.<\/p>\n<\/div>", "texte": "Le logiciel surveille la situation de l'établissement et fait remonter ce qu'il faut faire : un BRS à déposer avant le 15, une provision d'impôt à constituer parce que le résultat est positif, un exercice échu à clôturer, des impayés à suivre. Chaque conseil est classé Attention ou Info et rattaché à son domaine. Fiscal › Conseils Les premiers conseils remontent aussi sur le tableau de bord : la direction est prévenue sans ouvrir le module. Ce que le module n'est pas C'est une aide au pilotage, pas un cabinet fiscal. Les montants sont des estimations calculées sur les écritures de l'école : ils remplacent un tableur, pas l'avis d'un expert-comptable. Le dire clairement en formation évite un malentendu coûteux."}]}, "rh": {"id": "rh", "titre": "Ressources humaines", "court": "Ressources humaines", "nouveau": false, "eyebrow": "", "chapeau": "Le personnel, la paie au barème sénégalais et les avances sur\n  salaire. Un bulletin validé écrit lui-même ses écritures : salaire brut,\n  cotisations, retenues, net à payer.", "chapeau_texte": "Le personnel, la paie au barème sénégalais et les avances sur salaire. Un bulletin validé écrit lui-même ses écritures : salaire brut, cotisations, retenues, net à payer.", "licences": [{"nom": "Essai", "inclus": false}, {"nom": "Basic", "inclus": false}, {"nom": "Pro", "inclus": false}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "", "intro_texte": "", "rubriques": [{"id": "rh--le-personnel", "titre": "Le personnel", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Trois catégories d'employés (<b>enseignants<\/b>, <b>administration<\/b>,\n    <b>personnel d'appui<\/b>) et cinq types de contrat (CDI, CDD, vacataire,\n    stagiaire, prestataire). Le statut cadre, le nombre d'enfants et la situation\n    matrimoniale ne sont pas là pour décorer : ils entrent directement dans le\n    calcul de l'impôt et des allocations.<\/p>\n<p>Le <b>mode de paiement<\/b> de chaque salarié (banque, caisse, Wave, Orange\n    Money) décide du compte de trésorerie débité au moment du règlement.<\/p>\n<p><span class=\"badge-nouveau\">Nouveau<\/span> Une barre de recherche (nom,\n    matricule, poste, téléphone) et un filtre <b>Présents / Partis / Tous<\/b>. Un\n    salarié qui quitte l'école n'est pas supprimé : on enregistre son\n    <b>départ<\/b> (date et motif), et aucun bulletin ne peut plus être produit\n    après ce mois. La suppression n'est possible que pour une fiche sans aucun\n    historique comptable, c'est-à-dire créée par erreur.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Employés : recherche, filtre Présents, Partis, Tous, puis la liste avec matricule, nom, type, poste, contrat, salaire de base, statut et actions dont Départ.\" decoding=\"async\" loading=\"lazy\" src=\"captures/rh-employes.webp\"/>\n<figcaption><b>RH › Employés<\/b><span>Aux Palmiers : 15 salariés, 9 enseignants, 4 à l'administration et 2 au personnel d'appui, pour 3 610 000 FCFA de salaires de base par mois. La dernière icône enregistre un départ.<\/span><\/figcaption>\n<\/figure>", "texte": "Trois catégories d'employés ( enseignants , administration , personnel d'appui ) et cinq types de contrat (CDI, CDD, vacataire, stagiaire, prestataire). Le statut cadre, le nombre d'enfants et la situation matrimoniale ne sont pas là pour décorer : ils entrent directement dans le calcul de l'impôt et des allocations. Le mode de paiement de chaque salarié (banque, caisse, Wave, Orange Money) décide du compte de trésorerie débité au moment du règlement. Nouveau Une barre de recherche (nom, matricule, poste, téléphone) et un filtre Présents / Partis / Tous . Un salarié qui quitte l'école n'est pas supprimé : on enregistre son départ (date et motif), et aucun bulletin ne peut plus être produit après ce mois. La suppression n'est possible que pour une fiche sans aucun historique comptable, c'est-à-dire créée par erreur. RH › Employés Aux Palmiers : 15 salariés, 9 enseignants, 4 à l'administration et 2 au personnel d'appui, pour 3 610 000 FCFA de salaires de base par mois. La dernière icône enregistre un départ."}, {"id": "rh--produire-la-paie-du-mois", "titre": "Produire la paie du mois", "nouveau": false, "etape": false, "html": "<ol class=\"etapes\">\n<li><b>Vérifier les paramètres fiscaux<\/b> une fois par an : taux IPRES du\n    régime général et des cadres, plafonds, CSS, ATMP, CFCE, prime de transport.\n    Le logiciel est livré avec les barèmes en vigueur ; on n'y touche qu'en cas\n    de changement réglementaire.<\/li>\n<li><b>Saisir les avances du mois<\/b>, s'il y en a, avant de générer les\n    bulletins.<\/li>\n<li><b>Générer les bulletins<\/b> du mois. Le calcul part du salaire de base,\n    ajoute primes et indemnités, déduit les cotisations salariales, l'impôt et les\n    avances, et donne le net.<\/li>\n<li><span class=\"badge-nouveau\">Nouveau<\/span> <b>Absences et retards<\/b> :\n    indiquez le nombre de jours d'absence et d'heures de retard. Le logiciel\n    propose une retenue (1/30ᵉ du salaire de base par jour, 1/173,33ᵉ par heure),\n    que l'on peut corriger. Elle est déduite du brut, donc des cotisations. Une\n    <b>note d'explication<\/b> est alors obligatoire, et elle s'imprime sur le\n    bulletin.<\/li>\n<li><b>Contrôler<\/b> les bulletins en brouillon. C'est le dernier moment où\n    tout se corrige librement.<\/li>\n<li><b>Valider.<\/b> Les écritures partent au journal. Le bulletin n'est plus\n    modifiable.<\/li>\n<li><b>Payer<\/b>, puis <b>imprimer<\/b> les bulletins pour les remettre aux\n    salariés.<\/li>\n<\/ol><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Bulletins SYSCOHADA : filtres par employé, mois et année, puis la liste des bulletins avec période, brut, IPRES et IR, net, charges patronales, statut et actions.\" decoding=\"async\" loading=\"lazy\" src=\"captures/rh-bulletins.webp\"/>\n<figcaption><b>Bulletins<\/b><span>Brouillon, puis Validé, puis Payé.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture document\">\n<img alt=\"Bulletin de paie PDF : identité du salarié, gains, retenues salariales, net à payer, charges patronales.\" decoding=\"async\" loading=\"lazy\" src=\"captures/doc-bulletin-paie.webp\"/>\n<figcaption><b>Bulletin de paie<\/b><span>Conforme au cadre social sénégalais ; le mode de paiement est rappelé sous le net.<\/span><\/figcaption>\n<\/figure>\n<\/div><div class=\"alerte alerte-piege\">\n<h4>Annuler un bulletin libère son mois<\/h4>\n<p>Un bulletin validé par erreur s'annule (l'icône barrée) : ses écritures sont\n    neutralisées, et on peut en générer un nouveau pour le même mois. On ne cherche\n    pas à le modifier.<\/p>\n<\/div>", "texte": "Vérifier les paramètres fiscaux une fois par an : taux IPRES du régime général et des cadres, plafonds, CSS, ATMP, CFCE, prime de transport. Le logiciel est livré avec les barèmes en vigueur ; on n'y touche qu'en cas de changement réglementaire. Saisir les avances du mois , s'il y en a, avant de générer les bulletins. Générer les bulletins du mois. Le calcul part du salaire de base, ajoute primes et indemnités, déduit les cotisations salariales, l'impôt et les avances, et donne le net. Nouveau Absences et retards : indiquez le nombre de jours d'absence et d'heures de retard. Le logiciel propose une retenue (1/30ᵉ du salaire de base par jour, 1/173,33ᵉ par heure), que l'on peut corriger. Elle est déduite du brut, donc des cotisations. Une note d'explication est alors obligatoire, et elle s'imprime sur le bulletin. Contrôler les bulletins en brouillon. C'est le dernier moment où tout se corrige librement. Valider. Les écritures partent au journal. Le bulletin n'est plus modifiable. Payer , puis imprimer les bulletins pour les remettre aux salariés. Bulletins Brouillon, puis Validé, puis Payé. Bulletin de paie Conforme au cadre social sénégalais ; le mode de paiement est rappelé sous le net. Annuler un bulletin libère son mois Un bulletin validé par erreur s'annule (l'icône barrée) : ses écritures sont neutralisées, et on peut en générer un nouveau pour le même mois. On ne cherche pas à le modifier."}, {"id": "rh--avances-sur-salaire", "titre": "Avances sur salaire", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Une avance accordée en cours de mois est <b>imputée automatiquement<\/b> sur\n    le bulletin suivant, quelle que soit sa date. L'imputation est plafonnée au net\n    à payer : si l'avance dépasse ce que le salarié doit toucher, le solde est\n    reporté sur le bulletin d'après, au lieu de donner un net négatif. L'avance\n    peut être versée sur plusieurs canaux et rattachée à un projet.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Avances : liste des avances avec employé, montant, restant dû, date, mode et statut Imputé.\" decoding=\"async\" loading=\"lazy\" src=\"captures/rh-avances.webp\"/>\n<figcaption><b>RH › Avances<\/b><span>Le statut passe à <i>Imputé<\/i> dès que l'avance a été retenue sur un bulletin.<\/span><\/figcaption>\n<\/figure><div class=\"alerte alerte-piege\">\n<h4>Le régime de paie se choisit avant le premier bulletin<\/h4>\n<p>Paramètres fiscaux propose deux régimes : <b>Complet<\/b>, pour un\n    établissement affilié à l'IPRES et à la CSS, et <b>Simplifié<\/b>, sans\n    cotisations ni allocations familiales, pour une structure non affiliée.\n    Changer de régime après avoir validé des bulletins rend l'année incohérente :\n    la question se tranche à l'installation.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Paramètres Fiscaux : régime de paie de l'établissement, puis les taux et plafonds.\" decoding=\"async\" loading=\"lazy\" src=\"captures/rh-parametres.webp\"/>\n<figcaption><b>RH › Paramètres fiscaux<\/b><span>Un seul jeu de paramètres par exercice, partagé par tous les bulletins.<\/span><\/figcaption>\n<\/figure>", "texte": "Une avance accordée en cours de mois est imputée automatiquement sur le bulletin suivant, quelle que soit sa date. L'imputation est plafonnée au net à payer : si l'avance dépasse ce que le salarié doit toucher, le solde est reporté sur le bulletin d'après, au lieu de donner un net négatif. L'avance peut être versée sur plusieurs canaux et rattachée à un projet. RH › Avances Le statut passe à Imputé dès que l'avance a été retenue sur un bulletin. Le régime de paie se choisit avant le premier bulletin Paramètres fiscaux propose deux régimes : Complet , pour un établissement affilié à l'IPRES et à la CSS, et Simplifié , sans cotisations ni allocations familiales, pour une structure non affiliée. Changer de régime après avoir validé des bulletins rend l'année incohérente : la question se tranche à l'installation. RH › Paramètres fiscaux Un seul jeu de paramètres par exercice, partagé par tous les bulletins."}]}, "academique": {"id": "academique", "titre": "Gestion académique", "court": "Gestion académique", "nouveau": false, "eyebrow": "", "chapeau": "Les classes, les matières et leurs coefficients, la saisie des\n  notes, le calcul des moyennes et des rangs, les bulletins, le suivi de chaque\n  élève. Pour les daaras, le suivi de mémorisation du Coran s'y ajoute.", "chapeau_texte": "Les classes, les matières et leurs coefficients, la saisie des notes, le calcul des moyennes et des rangs, les bulletins, le suivi de chaque élève. Pour les daaras, le suivi de mémorisation du Coran s'y ajoute.", "licences": [{"nom": "Essai", "inclus": false}, {"nom": "Basic", "inclus": false}, {"nom": "Pro", "inclus": false}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "<div class=\"texte\">\n<p>Six onglets : <b>Paramétrage<\/b>, <b>Saisie Notes<\/b>, <b>Résultats<\/b>,\n    <b>Analyse<\/b>, <b>Historique<\/b> et <b>Suivi pédagogique<\/b>, plus\n    <b>Mémorisation<\/b> pour les daaras.<\/p>\n<\/div>", "intro_texte": "Six onglets : Paramétrage , Saisie Notes , Résultats , Analyse , Historique et Suivi pédagogique , plus Mémorisation pour les daaras.", "rubriques": [{"id": "academique--parametrage-a-faire-une-fois-et-bien", "titre": "Paramétrage — à faire une fois, et bien", "nouveau": false, "etape": false, "html": "<ol class=\"etapes\">\n<li><b>Le découpage de l'année<\/b> : trimestres, semestres ou périodes, et\n    combien. Le vocabulaire choisi ici se retrouve sur tous les bulletins.<\/li>\n<li><span class=\"badge-nouveau\">Nouveau<\/span> <b>Établissement hybride<\/b> : à\n    cocher pour une école qui suit un programme français et un programme arabe.\n    Chaque matière est alors rattachée à un programme, et chaque programme a ses\n    bulletins, sa moyenne et son rang. Le bulletin arabe s'imprime de droite à\n    gauche.<\/li>\n<li><span class=\"badge-nouveau\">Nouveau<\/span> <b>Calcul de la moyenne<\/b>, le\n    réglage le plus important de l'onglet (voir l'encadré plus bas).<\/li>\n<li><b>Les classes<\/b>, rattachées à leur niveau et à leur section : CI, CP,\n    CE1… L'ordre est <b>niveau › section › classe<\/b>.<\/li>\n<li><b>Les matières<\/b>, classe par classe, avec leur <b>coefficient<\/b> et\n    leur <b>barème<\/b> (/5, /10, /20, /30…). L'icône de copie reprend les\n    matières d'une classe vers d'autres classes.<\/li>\n<li><b>Les types d'évaluation<\/b> et leur poids : une composition de poids 2\n    compte double par rapport à un devoir de poids 1.<\/li>\n<\/ol><figure class=\"capture\">\n<img alt=\"Onglet Paramétrage : découpage de l'année, établissement hybride, calcul de la moyenne (règle, barème, arrondi), puis les classes, les matières et les types d'évaluation.\" decoding=\"async\" loading=\"lazy\" src=\"captures/acad-parametrage.webp\"/>\n<figcaption><b>Académique › Paramétrage<\/b><span>Les trois menus de <i>Calcul de la moyenne<\/i> décident de ce qu'imprimeront tous les bulletins de l'année.<\/span><\/figcaption>\n<\/figure><div class=\"cas\">\n<div class=\"titre-cas\">Calcul de la moyenne — trois choix à faire avec la direction<\/div>\n<ul class=\"puces\">\n<li><b>La règle.<\/b> <i>Moyenne des matières<\/i> : chaque matière est\n      ramenée au même barème, puis on fait la moyenne selon les coefficients (une\n      matière sur /5 compte autant qu'une matière sur /20). <i>Total des\n      points<\/i> : on additionne toutes les notes et on divise par le total des\n      barèmes, comme le font beaucoup d'écoles à la main (145 points sur 150\n      donnent 9,67 sur 10).<\/li>\n<li><b>Moyenne sur<\/b> : le barème du niveau, ou /10, ou /20 pour toute\n      l'école.<\/li>\n<li><b>Deux décimales<\/b> : <i>arrondies<\/i> (9,666 donne 9,67) ou\n      <i>tronquées<\/i> (9,666 donne 9,66).<\/li>\n<\/ul>\n<p>Chaque matière s'affiche toujours sur <b>son<\/b> barème (« 8,33/10 ») ;\n    seule la moyenne générale est ramenée au barème choisi. Changer l'un de ces\n    réglages efface les moyennes déjà calculées de l'année : il faut ensuite\n    relancer <b>Calculer Moyennes<\/b> pour chaque classe et chaque période.<\/p>\n<\/div><div class=\"alerte alerte-piege\">\n<h4>Section et classe ne sont pas la même chose<\/h4>\n<p>La <b>section<\/b> est une grille de tarifs : elle décide de ce que paie la\n    famille. La <b>classe<\/b> est le groupe pédagogique : elle décide de ce que\n    l'élève apprend et de la façon dont il est classé. Un élève sans classe\n    n'apparaît dans aucun calcul de moyenne : c'est la première chose à vérifier\n    quand un bulletin manque.<\/p>\n<\/div>", "texte": "Le découpage de l'année : trimestres, semestres ou périodes, et combien. Le vocabulaire choisi ici se retrouve sur tous les bulletins. Nouveau Établissement hybride : à cocher pour une école qui suit un programme français et un programme arabe. Chaque matière est alors rattachée à un programme, et chaque programme a ses bulletins, sa moyenne et son rang. Le bulletin arabe s'imprime de droite à gauche. Nouveau Calcul de la moyenne , le réglage le plus important de l'onglet (voir l'encadré plus bas). Les classes , rattachées à leur niveau et à leur section : CI, CP, CE1… L'ordre est niveau › section › classe . Les matières , classe par classe, avec leur coefficient et leur barème (/5, /10, /20, /30…). L'icône de copie reprend les matières d'une classe vers d'autres classes. Les types d'évaluation et leur poids : une composition de poids 2 compte double par rapport à un devoir de poids 1. Académique › Paramétrage Les trois menus de Calcul de la moyenne décident de ce qu'imprimeront tous les bulletins de l'année. Calcul de la moyenne — trois choix à faire avec la direction La règle. Moyenne des matières : chaque matière est ramenée au même barème, puis on fait la moyenne selon les coefficients (une matière sur /5 compte autant qu'une matière sur /20). Total des points : on additionne toutes les notes et on divise par le total des barèmes, comme le font beaucoup d'écoles à la main (145 points sur 150 donnent 9,67 sur 10). Moyenne sur : le barème du niveau, ou /10, ou /20 pour toute l'école. Deux décimales : arrondies (9,666 donne 9,67) ou tronquées (9,666 donne 9,66). Chaque matière s'affiche toujours sur son barème (« 8,33/10 ») ; seule la moyenne générale est ramenée au barème choisi. Changer l'un de ces réglages efface les moyennes déjà calculées de l'année : il faut ensuite relancer Calculer Moyennes pour chaque classe et chaque période. Section et classe ne sont pas la même chose La section est une grille de tarifs : elle décide de ce que paie la famille. La classe est le groupe pédagogique : elle décide de ce que l'élève apprend et de la façon dont il est classé. Un élève sans classe n'apparaît dans aucun calcul de moyenne : c'est la première chose à vérifier quand un bulletin manque."}, {"id": "academique--saisir-les-notes", "titre": "Saisir les notes", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>On choisit la classe, la matière et la période : les évaluations\n    existantes s'affichent en cartes. On clique sur une carte pour saisir toute\n    la classe sur un seul écran, puis on enregistre. <b>+ Évaluation<\/b> en crée\n    une nouvelle, avec son type, sa date et son barème. Une case « absent »\n    remplace la note quand l'élève n'a pas composé : une absence n'est pas un\n    zéro et ne compte pas comme tel.<\/p>\n<p><span class=\"badge-nouveau\">Nouveau<\/span> Chaque carte porte deux icônes :\n    <b>modifier<\/b> (titre, date, barème, type) et <b>supprimer<\/b>. Modifier le\n    barème ne convertit jamais les notes déjà saisies. Le logiciel refuse de\n    descendre sous une note existante et nomme les élèves concernés. Supprimer\n    emporte les notes de l'évaluation ; le logiciel annonce combien avant de le\n    faire.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Saisie Notes : CM2, Mathématiques, trimestre 1, deux cartes d'évaluation avec leurs icônes modifier et supprimer, puis la saisie des notes de la composition.\" decoding=\"async\" loading=\"lazy\" src=\"captures/acad-notes.webp\"/>\n<figcaption><b>Académique › Saisie Notes<\/b><span>La carte indique le barème (/20.0) et le nombre de notes déjà saisies.<\/span><\/figcaption>\n<\/figure>", "texte": "On choisit la classe, la matière et la période : les évaluations existantes s'affichent en cartes. On clique sur une carte pour saisir toute la classe sur un seul écran, puis on enregistre. + Évaluation en crée une nouvelle, avec son type, sa date et son barème. Une case « absent » remplace la note quand l'élève n'a pas composé : une absence n'est pas un zéro et ne compte pas comme tel. Nouveau Chaque carte porte deux icônes : modifier (titre, date, barème, type) et supprimer . Modifier le barème ne convertit jamais les notes déjà saisies. Le logiciel refuse de descendre sous une note existante et nomme les élèves concernés. Supprimer emporte les notes de l'évaluation ; le logiciel annonce combien avant de le faire. Académique › Saisie Notes La carte indique le barème (/20.0) et le nombre de notes déjà saisies."}, {"id": "academique--resultats-et-bulletins", "titre": "Résultats et bulletins", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p><b>Calculer Moyennes<\/b> produit, pour la classe et la période choisies,\n    la moyenne de chaque élève dans chaque matière, son <b>rang dans chaque\n    matière<\/b>, sa moyenne générale, son rang dans la classe et son appréciation.\n    En tête : moyenne de la classe, meilleure et plus faible moyenne, taux de\n    réussite.<\/p>\n<p><span class=\"badge-nouveau\">Nouveau<\/span> <b>Bulletins de la classe<\/b> produit\n    un seul PDF avec deux bulletins côte à côte sur une feuille A4 à l'italienne,\n    à taille réelle, avec un trait de découpe au milieu. L'en-tête porte le logo,\n    l'IA et l'IEF. Les matières en arabe s'impriment correctement même sur le\n    bulletin français.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Résultats : CM2, trimestre 1, boutons Calculer Moyennes et Bulletins de la classe, statistiques de la classe, puis le classement avec les moyennes par matière, le rang dans chaque matière, la moyenne générale et l'appréciation.\" decoding=\"async\" loading=\"lazy\" src=\"captures/acad-resultats.webp\"/>\n<figcaption><b>Académique › Résultats<\/b><span>Le petit rang sous chaque note est la place de l'élève dans la matière. À droite, une icône pour le bulletin de l'élève et une pour son suivi pédagogique.<\/span><\/figcaption>\n<\/figure><figure class=\"capture document\">\n<img alt=\"Bulletins de la classe CM2 : deux bulletins côte à côte sur une feuille A4 à l'italienne, chacun avec en-tête, identité de l'élève, tableau des matières, moyennes, rang et appréciation du conseil.\" decoding=\"async\" loading=\"lazy\" src=\"captures/doc-bulletins-classe.webp\"/>\n<figcaption><b>Bulletins de la classe<\/b><span>Deux élèves par feuille : on coupe au milieu et chaque famille reçoit son bulletin.<\/span><\/figcaption>\n<\/figure><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Analyse : répartition des élèves par mention, évolution par période, meilleures classes et meilleurs élèves.\" decoding=\"async\" loading=\"lazy\" src=\"captures/acad-analyse.webp\"/>\n<figcaption><b>Analyse<\/b><span>Les mentions suivent le barème de l'école : sur /10, « Bien » ne commence pas à 14.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Onglet Historique : bulletins déjà calculés, filtrables par élève, classe, période et année, avec leur PDF.\" decoding=\"async\" loading=\"lazy\" src=\"captures/acad-historique.webp\"/>\n<figcaption><b>Historique<\/b><span>Les bulletins des périodes passées se réimpriment sans recalcul.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "Calculer Moyennes produit, pour la classe et la période choisies, la moyenne de chaque élève dans chaque matière, son rang dans chaque matière , sa moyenne générale, son rang dans la classe et son appréciation. En tête : moyenne de la classe, meilleure et plus faible moyenne, taux de réussite. Nouveau Bulletins de la classe produit un seul PDF avec deux bulletins côte à côte sur une feuille A4 à l'italienne, à taille réelle, avec un trait de découpe au milieu. L'en-tête porte le logo, l'IA et l'IEF. Les matières en arabe s'impriment correctement même sur le bulletin français. Académique › Résultats Le petit rang sous chaque note est la place de l'élève dans la matière. À droite, une icône pour le bulletin de l'élève et une pour son suivi pédagogique. Bulletins de la classe Deux élèves par feuille : on coupe au milieu et chaque famille reçoit son bulletin. Analyse Les mentions suivent le barème de l'école : sur /10, « Bien » ne commence pas à 14. Historique Les bulletins des périodes passées se réimpriment sans recalcul."}, {"id": "academique--suivi-pedagogique", "titre": "Suivi pédagogique", "nouveau": true, "etape": false, "html": "<div class=\"texte\">\n<p>Choisissez <b>d'abord la classe, puis l'élève<\/b> (tant qu'aucun élève\n    n'est choisi, l'écran reste vide). On voit alors l'évolution de sa moyenne\n    d'une période à l'autre, matière par matière, face à la moyenne de la classe,\n    avec ses points forts, ses points faibles, ce qu'il doit améliorer et des\n    recommandations. La <b>fiche pédagogique<\/b> se télécharge en PDF, en\n    français ou en arabe, pour le conseil de classe ou la rencontre avec les\n    parents.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Suivi pédagogique : CM2, une élève, ses moyennes et rangs par trimestre, l'évolution par matière, puis les points forts, points faibles et points à améliorer.\" decoding=\"async\" loading=\"lazy\" src=\"captures/acad-suivi.webp\"/>\n<figcaption><b>Académique › Suivi pédagogique<\/b><span>« En baisse » et « En progrès » comparent la dernière période à la précédente.<\/span><\/figcaption>\n<\/figure><div class=\"alerte alerte-info\">\n<h4>Pour les daaras — le suivi de mémorisation<\/h4>\n<p>Sous licence Taxawu Daara, l'onglet <b>Mémorisation<\/b> suit la\n    mémorisation du Coran : parcours du ndongo, progression par sourate et par\n    subdivision (juz, hizb, nisf, rub'), et rapport bilingue arabe-français. Les\n    deux riwaaya, Warsh et Hafs, sont prises en charge.<\/p>\n<\/div>", "texte": "Choisissez d'abord la classe, puis l'élève (tant qu'aucun élève n'est choisi, l'écran reste vide). On voit alors l'évolution de sa moyenne d'une période à l'autre, matière par matière, face à la moyenne de la classe, avec ses points forts, ses points faibles, ce qu'il doit améliorer et des recommandations. La fiche pédagogique se télécharge en PDF, en français ou en arabe, pour le conseil de classe ou la rencontre avec les parents. Académique › Suivi pédagogique « En baisse » et « En progrès » comparent la dernière période à la précédente. Pour les daaras — le suivi de mémorisation Sous licence Taxawu Daara, l'onglet Mémorisation suit la mémorisation du Coran : parcours du ndongo, progression par sourate et par subdivision (juz, hizb, nisf, rub'), et rapport bilingue arabe-français. Les deux riwaaya, Warsh et Hafs, sont prises en charge."}]}, "gmrf": {"id": "gmrf", "titre": "Ressources financières", "court": "Ressources financières", "nouveau": false, "eyebrow": "", "chapeau": "Tout l'argent qui entre dans l'établissement <b>en dehors de la\n  scolarité<\/b> : dons, subventions, partenariats, collectes, tontines, prêts. Rien\n  ne se saisit en comptabilité : chaque opération y est reportée automatiquement.", "chapeau_texte": "Tout l'argent qui entre dans l'établissement en dehors de la scolarité : dons, subventions, partenariats, collectes, tontines, prêts. Rien ne se saisit en comptabilité : chaque opération y est reportée automatiquement.", "licences": [{"nom": "Essai", "inclus": false}, {"nom": "Basic", "inclus": false}, {"nom": "Pro", "inclus": false}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "<figure class=\"capture\">\n<img alt=\"Tableau de bord des ressources financières : total mobilisé, dons, subventions, NATT en cours, capital restant dû, taux d'endettement, part de financement externe, coût moyen de la dette, puis les alertes d'échéances.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gmrf-tableau.webp\"/>\n<figcaption><b>Ressources financières › Tableau de bord<\/b><span>Les échéances en retard (cotisation de tontine, mensualité de prêt) remontent en tête. Le directeur voit d'un coup d'œil ce qu'il doit payer cette semaine.<\/span><\/figcaption>\n<\/figure>", "intro_texte": "Ressources financières › Tableau de bord Les échéances en retard (cotisation de tontine, mensualité de prêt) remontent en tête. Le directeur voit d'un coup d'œil ce qu'il doit payer cette semaine.", "rubriques": [{"id": "gmrf--financements", "titre": "Financements", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Un financement est une ressource reçue en une fois : don, subvention\n    d'exploitation ou d'investissement, partenariat d'entreprise, collecte en\n    ligne. On le crée <b>Attendu<\/b> quand il est seulement annoncé, puis il passe\n    à <b>Reçu<\/b> à l'encaissement.<\/p>\n<p>Chaque type de ressource porte son compte comptable et sa <b>nature<\/b> :\n    produit, capitaux propres ou dette. Une subvention d'investissement ne\n    s'enregistre pas comme un don. Le paramétrage (onglet Paramètres du module)\n    se fait une fois, avec l'expert-comptable de l'école.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Financements : liste avec référence, type, libellé, source, montant et statut Reçu ou Attendu.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gmrf-financements.webp\"/>\n<figcaption><b>Financements<\/b><span>Un financement <i>Attendu<\/i>, ici une subvention du ministère annoncée mais pas encore versée, s'encaisse d'un clic sur <i>Encaisser<\/i>.<\/span><\/figcaption>\n<\/figure>", "texte": "Un financement est une ressource reçue en une fois : don, subvention d'exploitation ou d'investissement, partenariat d'entreprise, collecte en ligne. On le crée Attendu quand il est seulement annoncé, puis il passe à Reçu à l'encaissement. Chaque type de ressource porte son compte comptable et sa nature : produit, capitaux propres ou dette. Une subvention d'investissement ne s'enregistre pas comme un don. Le paramétrage (onglet Paramètres du module) se fait une fois, avec l'expert-comptable de l'école. Financements Un financement Attendu , ici une subvention du ministère annoncée mais pas encore versée, s'encaisse d'un clic sur Encaisser ."}, {"id": "gmrf--natt-tontine-et-prets", "titre": "NATT / Tontine et prêts", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>La tontine est un vrai instrument de financement au Sénégal, et le\n    logiciel la traite comme tel. On déclare le cycle (cotisation, nombre de\n    participants, périodicité, mode d'attribution) et l'échéancier se génère\n    tout seul. Chaque cotisation versée est pointée, et la réception de la\n    cagnotte s'enregistre au tour où elle tombe.<\/p>\n<p>À la création d'un prêt, le logiciel produit le <b>tableau\n    d'amortissement complet<\/b> : pour chaque échéance, la part de capital, la\n    part d'intérêts et le capital restant dû. Une simulation est possible avant\n    d'enregistrer, pour comparer deux offres bancaires. Chaque échéance réglée\n    écrit son décaissement, impute le capital sur l'emprunt et les intérêts en\n    charges financières.<\/p>\n<\/div><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet NATT / Tontine : le cycle des enseignants, 200 000 F × 10 parts, 80 % versé, cagnotte reçue.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gmrf-natt.webp\"/>\n<figcaption><b>NATT / Tontine<\/b><span>200 000 F × 10 parts, cagnotte reçue au 6ᵉ tour.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Onglet Prêts : prêt bancaire de 8 000 000 F à 9,5 % sur 36 mois, 7 échéances sur 36 réglées, capital restant dû.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gmrf-prets.webp\"/>\n<figcaption><b>Prêts<\/b><span>8 000 000 F à 9,5 % sur 36 mois, 7 échéances honorées.<\/span><\/figcaption>\n<\/figure>\n<\/div>", "texte": "La tontine est un vrai instrument de financement au Sénégal, et le logiciel la traite comme tel. On déclare le cycle (cotisation, nombre de participants, périodicité, mode d'attribution) et l'échéancier se génère tout seul. Chaque cotisation versée est pointée, et la réception de la cagnotte s'enregistre au tour où elle tombe. À la création d'un prêt, le logiciel produit le tableau d'amortissement complet : pour chaque échéance, la part de capital, la part d'intérêts et le capital restant dû. Une simulation est possible avant d'enregistrer, pour comparer deux offres bancaires. Chaque échéance réglée écrit son décaissement, impute le capital sur l'emprunt et les intérêts en charges financières. NATT / Tontine 200 000 F × 10 parts, cagnotte reçue au 6ᵉ tour. Prêts 8 000 000 F à 9,5 % sur 36 mois, 7 échéances honorées."}]}, "gouvernance": {"id": "gouvernance", "titre": "Gouvernance", "court": "Gouvernance", "nouveau": false, "eyebrow": "", "chapeau": "Il répond à la question de tout bailleur : <b>« où est passé\n  mon argent ? »<\/b> Le module rattache chaque dépense à un projet et à la\n  ressource qui la finance, puis reconstitue le chemin de bout en bout.", "chapeau_texte": "Il répond à la question de tout bailleur : « où est passé mon argent ? » Le module rattache chaque dépense à un projet et à la ressource qui la finance, puis reconstitue le chemin de bout en bout.", "licences": [{"nom": "Essai", "inclus": false}, {"nom": "Basic", "inclus": false}, {"nom": "Pro", "inclus": false}, {"nom": "Avancé", "inclus": true}, {"nom": "Taxawu Daara", "inclus": true}], "intro": "<div class=\"texte\">\n<p>Sept onglets : <b>Pilotage<\/b>, <b>Projets<\/b>, <b>Ressources<\/b>,\n    <b>Provisions<\/b>, <b>Rapprochement<\/b>, <b>Flux internes<\/b> et\n    <b>Traçabilité<\/b>.<\/p>\n<\/div>", "intro_texte": "Sept onglets : Pilotage , Projets , Ressources , Provisions , Rapprochement , Flux internes et Traçabilité .", "rubriques": [{"id": "gouvernance--ressources-et-projets", "titre": "Ressources et projets", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>Une <b>ressource<\/b> est une enveloppe : recettes scolaires, prêt,\n    subvention, don. Un <b>projet<\/b> est ce qu'on en fait : programme de cantine,\n    équipement numérique, réfection de la bibliothèque.<\/p>\n<p><span class=\"badge-nouveau\">Nouveau<\/span> <b>Une ressource entre toujours en\n    trésorerie et en comptabilité.<\/b> Ressources financières encaisse, Gouvernance\n    suit l'emploi des fonds, et les deux sont reliés : un financement reçu ou un\n    prêt débloqué dans Ressources financières apparaît ici tout seul, avec le\n    compte qui a reçu l'argent. À l'inverse, <b>Nouvelle ressource<\/b> demande le\n    compte de trésorerie (caisse, banque, Wave…) et enregistre l'encaissement dans\n    Ressources financières, écriture comprise. Rien n'est à saisir deux fois.<\/p>\n<ul class=\"puces\">\n<li>Un <b>prêt<\/b> se saisit dans Ressources financières › Prêts, pour son\n      tableau d'amortissement.<\/li>\n<li>Des fonds <b>promis<\/b> se notent « attendus » : la ressource apparaît à\n      l'encaissement.<\/li>\n<li>Les <b>recettes scolaires<\/b> sont une enveloppe de suivi, sans nouvel\n      encaissement : l'argent est déjà entré par les paiements des familles.<\/li>\n<li>Le montant, le compte et la date d'une ressource reliée se modifient\n      dans Ressources financières ; l'annuler là-bas l'annule ici.<\/li>\n<\/ul>\n<p>Quand on saisit une charge, un investissement, une avance ou une ligne de\n    budget, deux champs facultatifs indiquent le projet et la ressource. Le\n    logiciel <b>refuse la dépense qui dépasse l'enveloppe<\/b> et affiche le\n    montant disponible :<\/p>\n<\/div><div class=\"alerte alerte-erreur\">\n<h4>Message réel du logiciel<\/h4>\n<p class=\"mono\" style=\"font-size:14px\">Dépassement : disponible 560 000, demandé 615 000\n    sur « Subvention cantine scolaire »<\/p>\n<p>Ce n'est pas un blocage arbitraire : c'est la garantie qu'on ne dépensera\n    jamais plus que ce qu'une subvention a apporté. C'est ce contrôle qui rend la\n    traçabilité crédible devant un bailleur.<\/p>\n<\/div><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Projets : nombre de projets, budget cumulé, consommé et disponible, puis la liste avec code, libellé, responsable, statut, budget, consommé et avancement.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gouv-projets.webp\"/>\n<figcaption><b>Projets<\/b><span>Le programme cantine a consommé 53 % de son budget.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Onglet Ressources : les enveloppes avec leur type, montant mobilisé, affecté, consommé et le taux de consommation.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gouv-ressources.webp\"/>\n<figcaption><b>Ressources<\/b><span>Chaque enveloppe, le compte qui a reçu les fonds et l'opération de Ressources financières qui l'a encaissée (GRF-…, PRET-…).<\/span><\/figcaption>\n<\/figure>\n<\/div><figure class=\"capture\">\n<img alt=\"Fenêtre Mobiliser une ressource : type Don, libellé, organisme, montant 750 000, fonds reçus maintenant sur le compte 521 Banque, et la mention de l'écriture passée : débit du compte choisi, crédit 7588 Dons.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gouv-ressource-mobiliser.webp\"/>\n<figcaption><b>Mobiliser une ressource<\/b><span>Le compte de trésorerie est obligatoire ; l'écriture d'encaissement est passée aussitôt dans Ressources financières.<\/span><\/figcaption>\n<\/figure>", "texte": "Une ressource est une enveloppe : recettes scolaires, prêt, subvention, don. Un projet est ce qu'on en fait : programme de cantine, équipement numérique, réfection de la bibliothèque. Nouveau Une ressource entre toujours en trésorerie et en comptabilité. Ressources financières encaisse, Gouvernance suit l'emploi des fonds, et les deux sont reliés : un financement reçu ou un prêt débloqué dans Ressources financières apparaît ici tout seul, avec le compte qui a reçu l'argent. À l'inverse, Nouvelle ressource demande le compte de trésorerie (caisse, banque, Wave…) et enregistre l'encaissement dans Ressources financières, écriture comprise. Rien n'est à saisir deux fois. Un prêt se saisit dans Ressources financières › Prêts, pour son tableau d'amortissement. Des fonds promis se notent « attendus » : la ressource apparaît à l'encaissement. Les recettes scolaires sont une enveloppe de suivi, sans nouvel encaissement : l'argent est déjà entré par les paiements des familles. Le montant, le compte et la date d'une ressource reliée se modifient dans Ressources financières ; l'annuler là-bas l'annule ici. Quand on saisit une charge, un investissement, une avance ou une ligne de budget, deux champs facultatifs indiquent le projet et la ressource. Le logiciel refuse la dépense qui dépasse l'enveloppe et affiche le montant disponible : Message réel du logiciel Dépassement : disponible 560 000, demandé 615 000 sur « Subvention cantine scolaire » Ce n'est pas un blocage arbitraire : c'est la garantie qu'on ne dépensera jamais plus que ce qu'une subvention a apporté. C'est ce contrôle qui rend la traçabilité crédible devant un bailleur. Projets Le programme cantine a consommé 53 % de son budget. Ressources Chaque enveloppe, le compte qui a reçu les fonds et l'opération de Ressources financières qui l'a encaissée (GRF-…, PRET-…). Mobiliser une ressource Le compte de trésorerie est obligatoire ; l'écriture d'encaissement est passée aussitôt dans Ressources financières."}, {"id": "gouvernance--pilotage", "titre": "Pilotage", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>C'est la vue de synthèse du fondateur ou du conseil d'administration :\n    ressources mobilisées et consommées, produits et charges de l'exercice,\n    provisions actives, origine des ressources face à leur utilisation, et\n    trésorerie par nature (banques, caisses, mobile money).<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Pilotage : ressources mobilisées, consommées et disponibles, produits, charges, résultat, provisions, origine des ressources face aux emplois, et trésorerie par nature.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gouv-pilotage.webp\"/>\n<figcaption><b>Gouvernance › Pilotage<\/b><span>Les deux blocs du milieu, <i>origine des ressources<\/i> et <i>utilisation<\/i>, font une diapositive de conseil d'administration, sans aucune préparation.<\/span><\/figcaption>\n<\/figure>", "texte": "C'est la vue de synthèse du fondateur ou du conseil d'administration : ressources mobilisées et consommées, produits et charges de l'exercice, provisions actives, origine des ressources face à leur utilisation, et trésorerie par nature (banques, caisses, mobile money). Gouvernance › Pilotage Les deux blocs du milieu, origine des ressources et utilisation , font une diapositive de conseil d'administration, sans aucune préparation."}, {"id": "gouvernance--les-autres-leviers-du-module", "titre": "Les autres leviers du module", "nouveau": false, "etape": false, "html": "<ul class=\"puces\">\n<li><b>Provisions<\/b> : constituer une provision pour créances douteuses ou\n    pour gros entretien, et la reprendre le moment venu.<\/li>\n<li><b>Rapprochement bancaire<\/b> : saisir les lignes du relevé, pointer\n    automatiquement ce qui correspond, régulariser le reste.<\/li>\n<li><b>Flux internes<\/b> : un transfert de la caisse vers la banque n'est ni\n    une recette ni une dépense. Il se saisit ici pour ne pas fausser le résultat.\n    Les soldes de chaque canal, caisses de service comprises, s'affichent en\n    haut.<\/li>\n<li><b>Traçabilité<\/b> : d'où vient l'argent, à quoi il a servi, avec les\n    pièces justificatives de chaque projet et de chaque ressource.<\/li>\n<\/ul><div class=\"duo\">\n<figure class=\"capture\">\n<img alt=\"Onglet Flux internes : soldes de chaque canal de trésorerie, puis la liste des transferts de la caisse principale vers la banque.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gouv-flux.webp\"/>\n<figcaption><b>Flux internes<\/b><span>Les dépôts d'espèces en banque, fin de mois par fin de mois.<\/span><\/figcaption>\n<\/figure>\n<figure class=\"capture\">\n<img alt=\"Onglet Traçabilité : d'où vient l'argent, à quoi il sert, et l'impact en immobilisations, projets et charges.\" decoding=\"async\" loading=\"lazy\" src=\"captures/gouv-tracabilite.webp\"/>\n<figcaption><b>Traçabilité<\/b><span>L'écran qu'on ouvre devant un auditeur.<\/span><\/figcaption>\n<\/figure>\n<\/div><div class=\"alerte alerte-piege\">\n<h4>Un dépôt en banque n'est pas une dépense<\/h4>\n<p>L'erreur classique consiste à saisir le versement des espèces à la banque\n    comme une charge. L'école se retrouve avec une dépense fictive et un résultat\n    diminué d'autant. Un mouvement d'un compte de trésorerie vers un autre passe\n    <b>toujours<\/b> par Flux internes : le total de la trésorerie ne bouge pas,\n    seule sa répartition change.<\/p>\n<\/div>", "texte": "Provisions : constituer une provision pour créances douteuses ou pour gros entretien, et la reprendre le moment venu. Rapprochement bancaire : saisir les lignes du relevé, pointer automatiquement ce qui correspond, régulariser le reste. Flux internes : un transfert de la caisse vers la banque n'est ni une recette ni une dépense. Il se saisit ici pour ne pas fausser le résultat. Les soldes de chaque canal, caisses de service comprises, s'affichent en haut. Traçabilité : d'où vient l'argent, à quoi il a servi, avec les pièces justificatives de chaque projet et de chaque ressource. Flux internes Les dépôts d'espèces en banque, fin de mois par fin de mois. Traçabilité L'écran qu'on ouvre devant un auditeur. Un dépôt en banque n'est pas une dépense L'erreur classique consiste à saisir le versement des espèces à la banque comme une charge. L'école se retrouve avec une dépense fictive et un résultat diminué d'autant. Un mouvement d'un compte de trésorerie vers un autre passe toujours par Flux internes : le total de la trésorerie ne bouge pas, seule sa répartition change."}]}, "licence-cloture": {"id": "licence-cloture", "titre": "Sauvegarde et clôture", "court": "Sauvegarde & clôture", "nouveau": false, "eyebrow": "Fin de parcours", "chapeau": "", "chapeau_texte": "", "licences": [], "intro": "", "intro_texte": "", "rubriques": [{"id": "licence-cloture--sauvegarde", "titre": "Sauvegarde", "nouveau": false, "etape": false, "html": "<div class=\"texte\">\n<p>En mode local, les données sont sur l'ordinateur de l'école, et un\n    ordinateur d'école peut tomber en panne, être volé ou prendre l'eau. La\n    sauvegarde envoie chaque jour une copie vers les serveurs HADY GESMAN dès que\n    la machine est connectée, et garde des copies sur le poste. Tout est dans la\n    base : en cas de sinistre, l'école repart sur un poste neuf avec la dernière\n    copie. L'onglet n'existe qu'en mode local ; en mode cloud, la sauvegarde est\n    assurée par HADY GESMAN.<\/p>\n<p>À vérifier à chaque visite de maintenance : la date de la dernière\n    sauvegarde réussie. Une sauvegarde qui n'a jamais tourné est un incident, pas\n    un détail.<\/p>\n<\/div><figure class=\"capture\">\n<img alt=\"Onglet Sauvegarde : explication de la sauvegarde cloud automatique, avertissement si aucune sauvegarde n'a encore été faite, nombre de copies locales, taille et bouton Sauvegarder maintenant.\" decoding=\"async\" loading=\"lazy\" src=\"captures/param-sauvegarde.webp\"/>\n<figcaption><b>Paramètres › Sauvegarde<\/b><span>Cet avertissement orange ne doit jamais rester affiché.<\/span><\/figcaption>\n<\/figure>", "texte": "En mode local, les données sont sur l'ordinateur de l'école, et un ordinateur d'école peut tomber en panne, être volé ou prendre l'eau. La sauvegarde envoie chaque jour une copie vers les serveurs HADY GESMAN dès que la machine est connectée, et garde des copies sur le poste. Tout est dans l function tempsLecture(a) {
  const mots = (a.chapeau_texte + ' ' + a.intro_texte + ' ' + a.rubriques.map(r => r.texte).join(' ')).split(/\s+/).length;
  return Math.max(1, Math.round(mots / 200));
}

function rendreArticle(id, cible) {
  const a = ARTICLES[id];
  const cat = catDe[id];
  const i = D.ordre.indexOf(id);
  const prec = ARTICLES[D.ordre[i - 1]], suiv = ARTICLES[D.ordre[i + 1]];
  const pour = profilsDe(id);
  const estAZ = id === 'parametrage-az';
  const ouvertes = lire('ouvertes:' + id, null);
  const numEtape = t => (t.match(/^Étape (\d+)/) || [])[1];

  const rubriques = a.rubriques.map((r, k) => {
    const ouverte = r.id === cible || (ouvertes ? ouvertes.includes(r.id) : k < 2);
    const n = r.etape ? numEtape(r.titre) : null;
    const titre = r.etape ? r.titre.replace(/^Étape \d+\s*·\s*/, '') : r.titre;
    const faite = r.etape && lire('coche:etape-' + r.id, false);

          ${n ? `<span class="num">${n}</span>` : `<svg class="ico chevron" viewBox="0 0 24 24" aria-hidden="true">${ICONES.fleche}</svg>`}

        </button>
        ${r.etape ? `<label class="fait"><input type="checkbox" data-coche="etape-${r.id}" ${faite ? 'checked' : ''}> Étape faite</label>` : ''}
      </div>
      <div class="rubrique-corps" id="c-${r.id}" ${ouverte ? '' : 'hidden'}>${r.html}</div>
    </section>`;
  }).join('');

  const licences = a.licences.length ? `<span class="puces" aria-label="Licences">${a.licences.map(l =>
    `<span class="puce ${l.inclus ? 'oui' : 'non'}" title="${l.inclus ? 'Inclus' : 'Non inclus'} dans la licence ${echap(l.nom)}">${echap(l.nom)}</span>`).join('')}</span>` : '';

  $('#contenu').innerHTML = `
  <div class="article-cadre">
    <article class="article">
      <nav class="fil" aria-label="Fil d'Ariane"><a href="#accueil">Accueil</a><span aria-hidden="true">›</span><span>${echap(cat.titre)}</span><span aria-hidden="true">›</span><span>${echap(a.court)}</span></nav>
      <header class="article-tete">
        ${a.eyebrow ? `<span class="sur-titre">${echap(a.eyebrow)}</span>` : ''}
        <h1>${echap(a.titre)} ${a.nouveau ? '<span class="badge-nouveau">Nouveau</span>' : ''}</h1>
        ${a.chapeau ? `<p class="chapeau">${a.chapeau}</p>` : ''}
        <div class="meta-article">

          ${pour.length ? `<span>Concerne : ${pour.map(p => echap(p.titre)).join(', ')}</span>` : ''}
          ${licences}
        </div>
      </header>

      <div class="corps-article">

        ${a.rubriques.length ? `

          <span><button class="lien-bouton" id="tout-ouvrir">Tout déplier</button><button class="lien-bouton" id="tout-fermer">Tout replier</button></span></div>
        <div class="accordeon">${rubriques}</div>` : ''}

      <nav class="suite" aria-label="Articles voisins">
